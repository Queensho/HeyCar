name: Deploy CepQontag Staging

on:
  workflow_dispatch:

permissions:
  contents: read

# The former dispatcher checked out an unrelated feature branch and copied it to
# the VPS without backup/history/schema gates. Do not retain an alternate deploy
# path while migration provenance is unresolved. The reusable workflow checks out
# the selected caller commit and deliberately fails its release gate until the
# per-file reconciliation and deployed acceptance requirements are implemented.
# There is intentionally no rsync, migration, baseline or service restart here.
jobs:
  verify-before-deployment:
    uses: ./.github/workflows/marketplace-staging-readiness.yml
    with:
      verify_backup: true
    secrets: inherit
