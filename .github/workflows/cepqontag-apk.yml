name: CepQontag Android APK
on:
  push:
    branches: [main, 'ci/cepqontag-apk-build-20261018']
    paths:
      - '.github/workflows/cepqontag-apk.yml'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore missing Android scaffold
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name=heycar_app .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
      - name: Ensure Android notification permission in generated manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml missing after flutter create")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          root = tree.getroot()
          key = "{http://schemas.android.com/apk/res/android}name"
          permission = "android.permission.POST_NOTIFICATIONS"
          if not any(e.get(key) == permission for e in root.findall("uses-permission")):
              element = ET.Element("uses-permission", {key: permission})
              root.insert(0, element)
              tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Verified Android POST_NOTIFICATIONS permission")
          PY
      - name: Enable core library desugaring for notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          target = kts if kts.exists() else groovy
          if not target.exists():
              raise SystemExit("Android app Gradle configuration missing")
          text = target.read_text()
          is_kts = target.suffix == ".kts"
          setting = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
          if not re.search(r"(?:isCoreLibraryDesugaringEnabled|coreLibraryDesugaringEnabled)\s*(?:=|\s)\s*true", text):
              match = re.search(r"compileOptions\s*\{", text)
              if match:
                  text = text[:match.end()] + "\n        " + setting + text[match.end():]
              else:
                  match = re.search(r"android\s*\{", text)
                  if not match:
                      raise SystemExit("android Gradle block not found")
                  text = text[:match.end()] + "\n    compileOptions {\n        " + setting + "\n    }" + text[match.end():]
          if not re.search(r"coreLibraryDesugaring\s*\(", text):
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              match = re.search(r"dependencies\s*\{", text)
              if match:
                  text = text[:match.end()] + "\n    " + dep + text[match.end():]
              else:
                  text += "\ndependencies {\n    " + dep + "\n}\n"
          target.write_text(text)
          print("Enabled desugaring in", target)
          PY
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: CepQontag-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
