name: Build HeyCar Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Cepqar frontend branding
        run: python3 tool/brand_frontend.py

      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name heycar_app --org com.heycar --no-pub

      - name: Add Android call permissions and app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          marker = '<application'
          permissions = '''    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n'''
          if 'android.permission.RECORD_AUDIO' not in text:
              text = text.replace(marker, permissions + '\n    ' + marker, 1)
          text = text.replace('android:label="heycar_app"', 'android:label="Cepqar"')
          p.write_text(text)
          PY

      - name: Apply Cepqar Android launcher icon
        run: |
          set -e
          ICON="assets/app_icons/cepqar_icon.png"
          test -f "$ICON"
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            mkdir -p "$dir"
            cp "$ICON" "$dir/ic_launcher.png"
            cp "$ICON" "$dir/ic_launcher_round.png"
          done

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build Android test APK
        run: flutter build apk --debug --target lib/entry_theme_live.dart

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: heycar-android-test
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
