name: Build HeyCar Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply Cepqar frontend branding
        run: python3 tool/brand_frontend.py
      - name: Apply owner light theme
        run: python3 tool/owner_light_theme_patch.py
      - name: Apply maintenance light theme
        run: python3 tool/maintenance_light_theme_patch.py
      - name: Apply call ringback
        run: python3 tool/call_ringback_patch.py
      - name: Apply driver light dark theme
        run: python3 tool/driver_theme_patch.py
      - name: Match owner header to driver
        run: python3 tool/owner_header_size_patch.py
      - name: Apply Android back navigation
        run: python3 tool/back_navigation_patch.py
      - name: Apply runtime Android fixes
        run: python3 tool/fix_runtime_android.py
      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name app --org com.cepqar --no-pub
      - name: Add Android system settings bridge
        run: |
          cat > android/app/src/main/kotlin/com/cepqar/app/MainActivity.kt <<'EOF'
          package com.cepqar.app

          import android.content.ComponentName
          import android.content.Intent
          import android.net.Uri
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "com.cepqar.app/system_settings"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName).setMethodCallHandler { call, result ->
                      try {
                          when (call.method) {
                              "openAutoStart" -> openAutoStart()
                              "openMiuiPermissions" -> openMiuiPermissions()
                              "openBatterySettings" -> openBatterySettings()
                              "openAppDetails" -> openAppDetails()
                              else -> { result.notImplemented(); return@setMethodCallHandler }
                          }
                          result.success(true)
                      } catch (e: Exception) {
                          try { openAppDetails(); result.success(false) }
                          catch (fallback: Exception) { result.error("SETTINGS", fallback.message, null) }
                      }
                  }
              }

              private fun openAutoStart() {
                  val intent = Intent().apply {
                      component = ComponentName(
                          "com.miui.securitycenter",
                          "com.miui.permcenter.autostart.AutoStartManagementActivity"
                      )
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  startActivity(intent)
              }

              private fun openMiuiPermissions() {
                  val candidates = listOf(
                      "com.miui.permcenter.permissions.AppPermissionsEditorActivity",
                      "com.miui.permcenter.permissions.PermissionsEditorActivity"
                  )
                  var last: Exception? = null
                  for (activity in candidates) {
                      try {
                          val intent = Intent("miui.intent.action.APP_PERM_EDITOR").apply {
                              component = ComponentName("com.miui.securitycenter", activity)
                              putExtra("extra_pkgname", packageName)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          startActivity(intent)
                          return
                      } catch (e: Exception) { last = e }
                  }
                  throw last ?: IllegalStateException("MIUI permission screen unavailable")
              }

              private fun openBatterySettings() {
                  try {
                      startActivity(Intent().apply {
                          component = ComponentName(
                              "com.miui.powerkeeper",
                              "com.miui.powerkeeper.ui.HiddenAppsConfigActivity"
                          )
                          putExtra("package_name", packageName)
                          putExtra("package_label", "Cepqar")
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      })
                  } catch (e: Exception) {
                      startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                  }
              }

              private fun openAppDetails() {
                  startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                      data = Uri.parse("package:$packageName")
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  })
              }
          }
          EOF
      - name: Add native Android FCM delivery service
        run: |
          cat > android/app/src/main/kotlin/com/cepqar/app/CepqarFirebaseMessagingService.kt <<'EOF'
          package com.cepqar.app

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.net.Uri
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import com.google.firebase.messaging.FirebaseMessagingService
          import com.google.firebase.messaging.RemoteMessage
          import org.json.JSONObject
          import kotlin.math.abs

          class CepqarFirebaseMessagingService : FirebaseMessagingService() {
              companion object {
                  private const val GENERAL_CHANNEL = "cepqar_notifications_v5"
                  private const val CALL_CHANNEL = "cepqar_calls_v5"
              }

              override fun onMessageReceived(message: RemoteMessage) {
                  val data = message.data
                  val type = data["type"].orEmpty()
                  when (type) {
                      "incoming_call_cancelled" -> cancelCall(data["callId"].orEmpty())
                      "incoming_call", "call_request" -> showIncomingCall(data)
                      else -> showRegularNotification(data)
                  }
              }

              private fun ensureChannels() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                  if (manager.getNotificationChannel(GENERAL_CHANNEL) == null) {
                      val general = NotificationChannel(
                          GENERAL_CHANNEL,
                          "Cepqar Bildirimleri",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "Araç bildirimleri ve mesajlar"
                          enableVibration(true)
                          lockscreenVisibility = NotificationCompat.VISIBILITY_PUBLIC
                      }
                      manager.createNotificationChannel(general)
                  }

                  if (manager.getNotificationChannel(CALL_CHANNEL) == null) {
                      val ringtone = Uri.parse("android.resource://$packageName/${R.raw.cepqar_call}")
                      val attrs = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .build()
                      val call = NotificationChannel(
                          CALL_CHANNEL,
                          "Cepqar Gelen Aramalar",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "Kilit ekranında tam ekran gelen Cepqar aramaları"
                          enableVibration(true)
                          lockscreenVisibility = NotificationCompat.VISIBILITY_PUBLIC
                          setSound(ringtone, attrs)
                      }
                      manager.createNotificationChannel(call)
                  }
              }

              private fun showRegularNotification(data: Map<String, String>) {
                  ensureChannels()
                  val eventKey = data["notificationId"]
                      ?: data["messageId"]
                      ?: data["eventId"]
                      ?: System.currentTimeMillis().toString()
                  val id = stableId(eventKey)
                  val plate = data["plate"].orEmpty().trim().uppercase()
                  val title = if (plate.isNotEmpty()) plate else data["title"].orEmpty().ifBlank { "Cepqar" }
                  val body = data["body"].orEmpty().ifBlank {
                      data["message"].orEmpty().ifBlank { "Yeni bildiriminiz var." }
                  }

                  persistPending(data)

                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP
                      putExtra("cepqar_push", true)
                  }
                  val pending = PendingIntent.getActivity(
                      this,
                      id,
                      openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val n = NotificationCompat.Builder(this, GENERAL_CHANNEL)
                      .setSmallIcon(R.drawable.ic_stat_cepqar)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setAutoCancel(true)
                      .setOnlyAlertOnce(false)
                      .setContentIntent(pending)
                      .build()

                  (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify(id, n)
              }

              private fun showIncomingCall(data: Map<String, String>) {
                  ensureChannels()
                  val callId = data["callId"].orEmpty()
                  if (callId.isEmpty()) return
                  val id = stableId("call:$callId")
                  val plate = data["plate"].orEmpty().trim().uppercase()
                  val title = if (plate.isNotEmpty()) plate else "Cepqar Araması"
                  val body = data["body"].orEmpty().ifBlank {
                      data["message"].orEmpty().ifBlank { "QR üzerinden gizli arama" }
                  }

                  persistIncomingCall(data)

                  val fullIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP
                      putExtra("cepqar_call", true)
                      putExtra("callId", callId)
                  }
                  val fullPending = PendingIntent.getActivity(
                      this,
                      id,
                      fullIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val ringtone = Uri.parse("android.resource://$packageName/${R.raw.cepqar_call}")
                  val n = NotificationCompat.Builder(this, CALL_CHANNEL)
                      .setSmallIcon(R.drawable.ic_stat_cepqar)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setOngoing(true)
                      .setAutoCancel(false)
                      .setTimeoutAfter(45000)
                      .setSound(ringtone)
                      .setFullScreenIntent(fullPending, true)
                      .setContentIntent(fullPending)
                      .build()

                  (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify(id, n)
              }

              private fun cancelCall(callId: String) {
                  if (callId.isEmpty()) return
                  (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager)
                      .cancel(stableId("call:$callId"))
              }

              private fun persistPending(data: Map<String, String>) {
                  val json = JSONObject(data).toString()
                  getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)
                      .edit()
                      .putString("flutter.pending_push_navigation", json)
                      .apply()
              }

              private fun persistIncomingCall(data: Map<String, String>) {
                  val callId = data["callId"].orEmpty()
                  if (callId.isEmpty()) return
                  getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)
                      .edit()
                      .putString("flutter.pending_incoming_call_id", callId)
                      .apply()
              }

              private fun stableId(value: String): Int {
                  val h = value.hashCode()
                  return if (h == Int.MIN_VALUE) 1 else abs(h).coerceAtLeast(1)
              }
          }
          EOF

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -e
          test -n "$GOOGLE_SERVICES_JSON_B64"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('android/app/google-services.json'); data=json.loads(p.read_text())
          project_id=data.get('project_info',{}).get('project_id','')
          project_number=data.get('project_info',{}).get('project_number','')
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in data.get('client',[])]
          if 'com.cepqar.app' not in packages: raise SystemExit('Firebase config package mismatch: com.cepqar.app not found')
          print(f'Firebase Android config restored for com.cepqar.app | project_id={project_id} | project_number={project_number}')
          PY
      - name: Enable Firebase and Android desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts'); text=p.read_text()
          if 'com.google.gms.google-services' not in text:text=text.replace('plugins {','plugins {\n    id("com.google.gms.google-services") version "4.4.4"',1)
          if 'com.google.firebase.crashlytics' not in text:text=text.replace('plugins {','plugins {\n    id("com.google.firebase.crashlytics") version "3.0.8"',1)
          if 'isCoreLibraryDesugaringEnabled = true' not in text:text=text.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in text:
            if 'dependencies {' in text:text=text.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',1)
            else:text+='\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(text)
          PY
      - name: Add Android call and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml'); text=p.read_text(); marker='<application'
          if 'xmlns:tools=' not in text:
            text=text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">',1)
          permissions='''    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n'''
          if 'android.permission.RECORD_AUDIO' not in text:text=text.replace(marker,permissions+'\n    '+marker,1)
          text=text.replace('android:label="app"','android:label="Cepqar"')
          text=text.replace('android:launchMode="singleTop"','android:launchMode="singleInstance"')
          text=text.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:showWhenLocked="true"\n            android:turnScreenOn="true"')
          if 'com.google.firebase.messaging.default_notification_icon' not in text:
            text=text.replace('</application>','''        <meta-data\n            android:name="com.google.firebase.messaging.default_notification_icon"\n            android:resource="@drawable/ic_stat_cepqar" />\n    </application>''')
          if 'com.google.firebase.messaging.default_notification_channel_id' not in text:
            text=text.replace('</application>','''        <meta-data\n            android:name="com.google.firebase.messaging.default_notification_channel_id"\n            android:value="cepqar_notifications_v4" />\n    </application>''')
          if 'com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver' not in text:
            text=text.replace('</application>','''        <receiver\n            android:exported="false"\n            android:name="com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver" />\n    </application>''')
          if 'CepqarFirebaseMessagingService' not in text:
            text=text.replace('</application>','''        <service\n            android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingService"\n            tools:node="remove" />\n        <service\n            android:name=".CepqarFirebaseMessagingService"\n            android:exported="false">\n            <intent-filter>\n                <action android:name="com.google.firebase.MESSAGING_EVENT" />\n            </intent-filter>\n        </service>\n    </application>''')
          p.write_text(text)
          PY
      - name: Apply Cepqar Android icons
        run: |
          set -e
          ICON="assets/app_icons/cepqar_icon.png"; test -f "$ICON"
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do mkdir -p "$dir"; cp "$ICON" "$dir/ic_launcher.png"; cp "$ICON" "$dir/ic_launcher_round.png"; done
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_cepqar.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M5,4h14a3,3 0,0 1,3 3v8a3,3 0,0 1,-3 3h-6l-4,3v-3H5a3,3 0,0 1,-3 -3V7a3,3 0,0 1,3 -3zM7,9h10v2H7zM7,13h7v2H7z"/>
          </vector>
          EOF
      - name: Apply Cepqar native splash
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/native_splash_patch.py
      - name: Generate Cepqar incoming call ringtone
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import math, struct, wave
          from pathlib import Path
          rate=16000
          duration=40.0
          out=Path('android/app/src/main/res/raw/cepqar_call.wav')
          with wave.open(str(out),'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              frames=[]
              for i in range(int(rate*duration)):
                  t=i/rate
                  phase=t%3.0
                  if phase<1.55:
                      pulse=1.0 if (phase%0.72)<0.48 else 0.28
                      env=min(1.0,phase/0.05)*min(1.0,max(0.0,(1.55-phase)/0.08))
                      s=(0.58*math.sin(2*math.pi*523.25*t)+0.30*math.sin(2*math.pi*659.25*t)+0.12*math.sin(2*math.pi*783.99*t))*pulse*env
                  else:
                      s=0.0
                  frames.append(struct.pack('<h',int(max(-1,min(1,s))*14500)))
              w.writeframes(b''.join(frames))
          print('Cepqar ringtone generated:',out,out.stat().st_size)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Enable Flutter web platform
        run: flutter create . --platforms=web --project-name heycar_app --no-pub
      - name: Build business web panel
        run: flutter build web --release --target lib/entry_business.dart --base-href /HeyCar/isletme/
      - name: Prepare business web artifact
        run: |
          mkdir -p business-site/isletme
          cp -R build/web/. business-site/isletme/
      - name: Upload business web artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cepqar-business-web
          path: business-site
          retention-days: 7
      - name: Build Android test APK
        run: flutter build apk --debug --target lib/entry_theme_live.dart
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: heycar-android-test
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

