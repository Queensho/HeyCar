name: Build HeyCar Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply Cepqar frontend branding
        run: python3 tool/brand_frontend.py
      - name: Apply owner light theme
        run: python3 tool/owner_light_theme_patch.py
      - name: Apply maintenance light theme
        run: python3 tool/maintenance_light_theme_patch.py
      - name: Apply call ringback
        run: python3 tool/call_ringback_patch.py
      - name: Apply driver light dark theme
        run: python3 tool/driver_theme_patch.py
      - name: Match owner header to driver
        run: python3 tool/owner_header_size_patch.py
      - name: Apply Android back navigation
        run: python3 tool/back_navigation_patch.py
      - name: Apply runtime Android fixes
        run: python3 tool/fix_runtime_android.py
      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name app --org com.cepqar --no-pub
      - name: Add Android system settings bridge
        run: |
          cat > android/app/src/main/kotlin/com/cepqar/app/MainActivity.kt <<'EOF'
          package com.cepqar.app

          import android.content.ComponentName
          import android.content.Intent
          import android.net.Uri
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "com.cepqar.app/system_settings"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName).setMethodCallHandler { call, result ->
                      try {
                          when (call.method) {
                              "openAutoStart" -> openAutoStart()
                              "openMiuiPermissions" -> openMiuiPermissions()
                              "openBatterySettings" -> startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                              "openAppDetails" -> openAppDetails()
                              else -> { result.notImplemented(); return@setMethodCallHandler }
                          }
                          result.success(true)
                      } catch (e: Exception) {
                          try { openAppDetails(); result.success(false) }
                          catch (fallback: Exception) { result.error("SETTINGS", fallback.message, null) }
                      }
                  }
              }

              private fun openAutoStart() {
                  val intent = Intent().apply {
                      component = ComponentName(
                          "com.miui.securitycenter",
                          "com.miui.permcenter.autostart.AutoStartManagementActivity"
                      )
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  startActivity(intent)
              }

              private fun openMiuiPermissions() {
                  val candidates = listOf(
                      "com.miui.permcenter.permissions.AppPermissionsEditorActivity",
                      "com.miui.permcenter.permissions.PermissionsEditorActivity"
                  )
                  var last: Exception? = null
                  for (activity in candidates) {
                      try {
                          val intent = Intent("miui.intent.action.APP_PERM_EDITOR").apply {
                              component = ComponentName("com.miui.securitycenter", activity)
                              putExtra("extra_pkgname", packageName)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          startActivity(intent)
                          return
                      } catch (e: Exception) { last = e }
                  }
                  throw last ?: IllegalStateException("MIUI permission screen unavailable")
              }

              private fun openAppDetails() {
                  startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                      data = Uri.parse("package:$packageName")
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  })
              }
          }
          EOF
      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -e
          test -n "$GOOGLE_SERVICES_JSON_B64"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('android/app/google-services.json'); data=json.loads(p.read_text())
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in data.get('client',[])]
          if 'com.cepqar.app' not in packages: raise SystemExit('Firebase config package mismatch: com.cepqar.app not found')
          print('Firebase Android config restored for com.cepqar.app')
          PY
      - name: Enable Firebase and Android desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts'); text=p.read_text()
          if 'com.google.gms.google-services' not in text:text=text.replace('plugins {','plugins {\n    id("com.google.gms.google-services") version "4.4.4"',1)
          if 'isCoreLibraryDesugaringEnabled = true' not in text:text=text.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in text:
            if 'dependencies {' in text:text=text.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',1)
            else:text+='\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(text)
          PY
      - name: Add Android call and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml'); text=p.read_text(); marker='<application'
          permissions='''    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n'''
          if 'android.permission.RECORD_AUDIO' not in text:text=text.replace(marker,permissions+'\n    '+marker,1)
          text=text.replace('android:label="app"','android:label="Cepqar"')
          text=text.replace('android:launchMode="singleTop"','android:launchMode="singleInstance"')
          text=text.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:showWhenLocked="true"\n            android:turnScreenOn="true"')
          if 'com.google.firebase.messaging.default_notification_icon' not in text:
            text=text.replace('</application>','''        <meta-data\n            android:name="com.google.firebase.messaging.default_notification_icon"\n            android:resource="@drawable/ic_stat_cepqar" />\n    </application>''')
          p.write_text(text)
          PY
      - name: Apply Cepqar Android icons
        run: |
          set -e
          ICON="assets/app_icons/cepqar_icon.png"; test -f "$ICON"
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do mkdir -p "$dir"; cp "$ICON" "$dir/ic_launcher.png"; cp "$ICON" "$dir/ic_launcher_round.png"; done
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_cepqar.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M5,4h14a3,3 0,0 1,3 3v8a3,3 0,0 1,-3 3h-6l-4,3v-3H5a3,3 0,0 1,-3 -3V7a3,3 0,0 1,3 -3zM7,9h10v2H7zM7,13h7v2H7z"/>
          </vector>
          EOF
      - name: Generate Cepqar incoming call ringtone
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import math, struct, wave
          from pathlib import Path
          rate=16000
          duration=40.0
          out=Path('android/app/src/main/res/raw/cepqar_call.wav')
          with wave.open(str(out),'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              frames=[]
              for i in range(int(rate*duration)):
                  t=i/rate
                  phase=t%3.0
                  if phase<1.55:
                      pulse=1.0 if (phase%0.72)<0.48 else 0.28
                      env=min(1.0,phase/0.05)*min(1.0,max(0.0,(1.55-phase)/0.08))
                      s=(0.58*math.sin(2*math.pi*523.25*t)+0.30*math.sin(2*math.pi*659.25*t)+0.12*math.sin(2*math.pi*783.99*t))*pulse*env
                  else:
                      s=0.0
                  frames.append(struct.pack('<h',int(max(-1,min(1,s))*14500)))
              w.writeframes(b''.join(frames))
          print('Cepqar ringtone generated:',out,out.stat().st_size)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build Android test APK
        run: flutter build apk --debug --target lib/entry_theme_live.dart
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: heycar-android-test
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
