name: Build HeyCar Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name heycar_app --org com.heycar --no-pub

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build Android test APK
        run: flutter build apk --debug --target lib/entry_theme.dart

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: heycar-android-test
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
