name: Backend Release Audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: heycar_test_release
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/heycar_test_release
      NODE_ENV: test
      APP_ENV: staging
      STAGING_DISABLE_EXTERNAL_SERVICES: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run check
        working-directory: server
      - name: Staging deployment safety (no VPS/database access)
        run: python3 deploy/staging-pr318/deploy-staging-pr318.py --self-test
      - name: Test actual pinned staging release package
        run: python3 deploy/staging-pr318/test-release-packaging.py
      - name: PostgreSQL backup/restore semantic verification
        run: python3 deploy/staging-pr318/test-schema-restore.py --docker-container "${{ job.services.postgres.id }}"
      - name: Full backend suite including PostgreSQL (zero skips required)
        working-directory: server
        run: |
          set -o pipefail
          npm run test:release | tee backend-release-tests.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-release-test-results
          path: server/backend-release-tests.tap
