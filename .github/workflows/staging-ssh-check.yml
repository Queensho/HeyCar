name: Staging SSH Connection Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cepqontag-staging-ssh-check
  cancel-in-progress: false

jobs:
  ssh-check:
    name: Verify staging SSH (no deployment)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'test "$(id -un)" = "cepqontag-deploy" && test -f /home/cepqontag-deploy/app/server/server.js && echo STAGING_SSH_OK'
