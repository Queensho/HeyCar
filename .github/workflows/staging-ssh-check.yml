name: Staging SSH Connection Check

on:
  workflow_dispatch:
    inputs:
      car_wash_inspect:
        description: Read-only car wash staging readiness inspection
        type: boolean
        default: false
      car_wash_smoke:
        description: Run synthetic car wash API smoke on existing staging (no deployment)
        type: boolean
        default: false
      car_wash_diagnose:
        description: Rollback-only diagnosis of the old synthetic fixture uniqueness error
        type: boolean
        default: false
      car_wash_phase4:
        description: Publish staging web, restore isolated backup and test real web UI
        type: boolean
        default: false
      car_wash_phase4_verify_only:
        description: Verify already-published staging web without publishing or restarting
        type: boolean
        default: false
      car_wash_phase4_browser_only:
        description: Recheck browser only; preserve published app and completed restore evidence
        type: boolean
        default: false
      car_wash_performance:
        description: Read-only staging query plan and timing inspection
        type: boolean
        default: false
      car_wash_push_readiness:
        description: Inspect staging push setting presence without printing credentials
        type: boolean
        default: false
      car_wash_concurrent_final:
        description: Synthetic simultaneous business approval and owner cancellation preflight
        type: boolean
        default: false
      car_wash_firebase_setup:
        description: Install isolated QA push registration (delivery stays disabled; never copies Admin keys)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cepqontag-staging-ssh-check
  cancel-in-progress: false

jobs:
  ssh-check:
    if: inputs.car_wash_phase4 != true
    name: Verify staging SSH (no deployment)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: inputs.car_wash_inspect || inputs.car_wash_smoke || inputs.car_wash_diagnose || inputs.car_wash_performance || inputs.car_wash_push_readiness || inputs.car_wash_concurrent_final || inputs.car_wash_firebase_setup
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          EXPECTED_FINGERPRINT: ${{ secrets.STAGING_SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 10 -t ed25519 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          test -n "$EXPECTED_FINGERPRINT"
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1 {print $2}')
          test "$actual" = "$EXPECTED_FINGERPRINT"
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'test "$(id -un)" = "cepqontag-deploy" && test -f /home/cepqontag-deploy/app/server/server.js && echo STAGING_SSH_OK'

      - name: Inspect staging database and service without changing them
        if: inputs.car_wash_inspect
        shell: bash
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in main|release/car-wash-main-regression|feature/car-wash-phase-1) ;; *) exit 1 ;; esac
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /home/cepqontag-deploy/app/server && node' < deploy/car-wash-phase3/inspect.cjs | tee staging-inspection.json
      - uses: actions/upload-artifact@v4
        if: inputs.car_wash_inspect
        with:
          name: car-wash-staging-inspection
          path: staging-inspection.json
          retention-days: 7

      - name: Run synthetic real API smoke without deployment
        if: inputs.car_wash_smoke
        shell: bash
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in main|release/car-wash-main-regression|feature/car-wash-phase-1) ;; *) exit 1 ;; esac
          for attempt in 1 2 3; do
            ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              'cd /home/cepqontag-deploy/app/server && node' < deploy/car-wash-phase3/smoke.cjs | tee "staging-smoke-$attempt.json"
          done
      - uses: actions/upload-artifact@v4
        if: inputs.car_wash_smoke && always()
        with:
          name: car-wash-staging-smoke
          path: staging-smoke-*.json
          retention-days: 7

      - name: Diagnose old synthetic fixture collision with rollback only
        if: inputs.car_wash_diagnose
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in main|release/car-wash-main-regression|feature/car-wash-phase-1) ;; *) exit 1 ;; esac
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /home/cepqontag-deploy/app/server && node' < deploy/car-wash-phase3/diagnose-fixture.cjs

      - name: Read-only car wash query plan inspection
        if: inputs.car_wash_performance
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in main|release/car-wash-main-regression|feature/car-wash-phase-1) ;; *) exit 1 ;; esac
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /home/cepqontag-deploy/app/server && node' < deploy/car-wash-phase4/performance.cjs | tee phase4-performance-result.json
      - uses: actions/upload-artifact@v4
        if: inputs.car_wash_performance
        with:
          name: car-wash-phase4-performance
          path: phase4-performance-result.json
          retention-days: 14

      - name: Inspect staging push credential presence only
        if: inputs.car_wash_push_readiness
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in main|release/car-wash-main-regression|feature/car-wash-phase-1) ;; *) exit 1 ;; esac
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /home/cepqontag-deploy/app/server && node' < deploy/car-wash-phase4/push-readiness.cjs | tee phase4-push-readiness.json
      - uses: actions/upload-artifact@v4
        if: inputs.car_wash_push_readiness
        with:
          name: car-wash-push-readiness
          path: phase4-push-readiness.json
          retention-days: 14

      - name: Test concurrent business approval and owner cancellation on own QA bookings
        if: inputs.car_wash_concurrent_final
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in main|release/car-wash-main-regression|feature/car-wash-phase-1) ;; *) exit 1 ;; esac
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /home/cepqontag-deploy/app/server && node' < deploy/car-wash-phase4/concurrent-approval-cancel.cjs | tee phase4-concurrent-final.json
      - uses: actions/upload-artifact@v4
        if: inputs.car_wash_concurrent_final
        with:
          name: car-wash-concurrent-final
          path: phase4-concurrent-final.json
          retention-days: 14

      - name: Package QA push modules and apply additive staging registration setup
        if: inputs.car_wash_firebase_setup
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in main|release/car-wash-main-regression|feature/car-wash-phase-1) ;; *) exit 1 ;; esac
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os,shutil
          root=pathlib.Path('qa-firebase-package');root.mkdir()
          manifest={'sha':os.environ['GITHUB_SHA'],'files':{},'history':{}}
          names=['qa-firebase-admin.js','qa-service-push.js','service-booking-notification.js','migration-sql.js','owner-notification-center.js','notification-routes.js','valet-routes.js','car-wash-routes.js']
          for name in names:
              shutil.copyfile('server/'+name,root/name);manifest['files'][name]=hashlib.sha256((root/name).read_bytes()).hexdigest()
          name='harden-backups.cjs';shutil.copyfile('deploy/firebase-staging/'+name,root/name);manifest['files'][name]=hashlib.sha256((root/name).read_bytes()).hexdigest()
          for name in ['128_services_v2_qa_push.sql','129_owner_notification_center.sql']:
              shutil.copyfile('server/migrations/'+name,root/name);manifest['files'][name]=hashlib.sha256((root/name).read_bytes()).hexdigest()
          for p in pathlib.Path('server/migrations').glob('*.sql'):manifest['history'][p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'manifest.json').write_text(json.dumps(manifest))
          PYCODE
          destination="/home/cepqontag-deploy/qa-push-source/$GITHUB_SHA"
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$destination'"
          rsync -az -e "ssh -i $HOME/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p $SSH_PORT" qa-firebase-package/ "$SSH_USER@$SSH_HOST:$destination/"
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd /home/cepqontag-deploy/app/server && node - '$destination'" < deploy/firebase-staging/setup.cjs | tee qa-firebase-setup.json

      - name: Verify QA registration and denial without real push
        if: inputs.car_wash_firebase_setup
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /home/cepqontag-deploy/app/server && node' < deploy/firebase-staging/protocol-check.cjs | tee qa-push-protocol.json
      - name: Verify shared customer center with own QA booking and real staging API
        if: inputs.car_wash_firebase_setup
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /home/cepqontag-deploy/app/server && node' < deploy/firebase-staging/center-smoke.cjs | tee owner-center-smoke.json
      - uses: actions/upload-artifact@v4
        if: inputs.car_wash_firebase_setup && always()
        with:
          name: qa-firebase-setup
          path: |
            qa-firebase-setup.json
            qa-push-protocol.json
            owner-center-smoke.json
          retention-days: 14

  phase4:
    if: inputs.car_wash_phase4 == true
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated-phase4-only
          POSTGRES_DB: heycar_test_phase4_restore
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest successful staging web artifact
        id: staging_web
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 deploy/car-wash-phase4/select-artifact.py
      - uses: actions/download-artifact@v4
        with:
          name: cepqontag-car-wash-staging-web
          run-id: ${{ steps.staging_web.outputs.run_id }}
          github-token: ${{ github.token }}
          path: phase4-web
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          EXPECTED_FINGERPRINT: ${{ secrets.STAGING_SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 10 -t ed25519 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          test -n "$EXPECTED_FINGERPRINT"
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1 {print $2}')
          test "$actual" = "$EXPECTED_FINGERPRINT"
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'test "$(id -un)" = "cepqontag-deploy" && test -f /home/cepqontag-deploy/app/server/server.js && echo STAGING_SSH_OK'

      - name: Prepare staging-only web paths
        run: |
          case "$GITHUB_REF_NAME" in main|release/car-wash-main-regression|feature/car-wash-phase-1) ;; *) exit 1 ;; esac
          python3 - <<'PYCODE'
          from pathlib import Path
          for folder,prefix in [('business','car-wash-business'),('owner','car-wash-owner')]:
              p=Path('phase4-web')/folder/'index.html'
              s=p.read_text();assert s.count('<base href="/">')==1
              p.write_text(s.replace('<base href="/">','<base href="/'+prefix+'/">'))
          PYCODE
          cp deploy/car-wash-phase4/staging-web.cjs phase4-web/
      - name: Publish only staging web with code rollback
        if: inputs.car_wash_phase4_verify_only != true && inputs.car_wash_phase4_browser_only != true
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          destination="/home/cepqontag-deploy/car-wash-phase4-web/releases/$GITHUB_SHA"
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$destination'"
          rsync -az -e "ssh -i $HOME/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p $SSH_PORT" phase4-web/ "$SSH_USER@$SSH_HOST:$destination/"
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd /home/cepqontag-deploy/app/server && node - '$destination'" < deploy/car-wash-phase4/publish.cjs | tee phase4-publish-result.json
      - name: Snapshot real staging into private backup
        if: inputs.car_wash_phase4_browser_only != true
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/carwash-phase4"
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /home/cepqontag-deploy/app/server && node' < deploy/car-wash-phase4/snapshot.cjs > "$RUNNER_TEMP/carwash-phase4/snapshot.json"
          dump=$(python3 -c 'import json,os,re; d=json.load(open(os.environ["RUNNER_TEMP"]+"/carwash-phase4/snapshot.json"))["dump"]; assert re.fullmatch(r"/home/cepqontag-deploy/car-wash-phase4-backups/[0-9a-f-]{36}/heycar_staging.dump",d); print(d)')
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cat '$dump'" > "$RUNNER_TEMP/carwash-phase4/staging.dump"
          chmod 600 "$RUNNER_TEMP/carwash-phase4/"*
      - name: Full isolated restore verification (no VPS restore)
        if: inputs.car_wash_phase4_browser_only != true
        env:
          RESTORE_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 deploy/car-wash-phase4/verify-restore.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real business web browser tests
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/carwash-phase4"
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cat /home/cepqontag-deploy/car-wash-phase3-qa/d24a58be-8a8e-4e30-af55-d4faa77bad08.json' > "$RUNNER_TEMP/carwash-phase4/qa.json"
          chmod 600 "$RUNNER_TEMP/carwash-phase4/qa.json"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/carwash-playwright" playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/carwash-playwright/node_modules" QA_FILE="$RUNNER_TEMP/carwash-phase4/qa.json" node deploy/car-wash-phase4/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-wash-phase4-results
          path: |
            phase4-publish-result.json
            phase4-restore-result.json
            phase4-browser/
          retention-days: 14
      - name: Remove private runner data
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/carwash-phase4"
