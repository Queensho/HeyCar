name: Matrix Backend Integrity

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/matrix-backend.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heycar_matrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heycar_matrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: heycar_matrix
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8090
      JWT_SECRET: matrix-admin-jwt-secret-0123456789abcdef
      OWNER_AUTH_SECRET: matrix-owner-auth-secret-0123456789abcdef
      DRIVER_AUTH_SECRET: matrix-driver-auth-secret-0123456789abcdef
      QR_SECURITY_HASH_SALT: matrix-qr-security-salt-0123456789abcdef
      REMINDER_JOB_SECRET: matrix-reminder-secret-0123456789abcdef
      SESSION_SECRET: matrix-session-secret-0123456789abcdef
      TRUST_PROXY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install --prefix server --ignore-scripts --no-audit --no-fund

      - name: Syntax-check every backend module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find server -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: Run valet security regression tests
        working-directory: server
        run: node --test tests/security-valet-remediation.test.js

      - name: Verify conversation authorization invariants
        working-directory: server
        run: node --test tests/security-conversation-isolation.test.js

      - name: Syntax-check guarded live sync
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/matrix-live-sync.sh
          bash -n deploy/heycar-backup.sh
          grep -q 'DB ROLLBACK' deploy/matrix-live-sync.sh
          grep -q 'matrix-schema-check.sql' deploy/matrix-live-sync.sh
          grep -q '087_valet_audit_runtime_acl_repair.sql' deploy/matrix-live-sync.sh
          grep -q '088_story_highlights.sql' deploy/matrix-live-sync.sh
          grep -q '089_server_driven_ui.sql' deploy/matrix-live-sync.sh
          grep -q 'story-routes.js' deploy/matrix-live-sync.sh
          grep -q 'app-builder-routes.js' deploy/matrix-live-sync.sh
          grep -q 'heycar-backup.service' deploy/matrix-live-sync.sh
          grep -q 'OnCalendar=.*Europe/Istanbul' deploy/heycar-backup.timer
          grep -q 'HEYCAR_BACKUP_RETENTION_DAYS=14' deploy/heycar-backup.service

      - name: Verify token role isolation
        working-directory: server
        run: node matrix-auth-check.js

      - name: Verify Matrix source invariants
        working-directory: server
        run: node matrix-source-check.js

      - name: Create application database role
        shell: bash
        run: |
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='heycar_user') THEN
              CREATE ROLE heycar_user LOGIN PASSWORD 'matrix-runtime-password';
            END IF;
          END
          $$;
          SQL

      - name: Apply tracked migration chain from scratch
        working-directory: server
        run: npm run migrate

      - name: Verify tracked migration rerun is idempotent
        working-directory: server
        run: npm run migrate

      - name: Verify migration tracking count
        shell: bash
        run: |
          set -euo pipefail
          expected=$(find server/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          actual=$(psql -h 127.0.0.1 -U postgres -d heycar_matrix -Atqc "SELECT COUNT(*) FROM public.schema_migrations")
          test "$actual" = "$expected"
          echo "MATRIX_MIGRATION_TRACKING_OK count=$actual"

      - name: Verify Matrix schema invariants
        run: psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 -f server/matrix-schema-check.sql

      - name: Boot canonical API and verify health
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          DB_USER=heycar_user DB_PASSWORD=matrix-runtime-password node server.js > /tmp/cepqar-matrix-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/cepqar-matrix-api.log' EXIT

          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/health | tee /tmp/health.json | grep -q '"ok":true'; then
              ok=1
              break
            fi
            sleep 1
          done

          test "$ok" -eq 1
          grep -q '"service":"heycar-api"' /tmp/health.json
          echo "MATRIX_BACKEND_HEALTH_OK"

          assert_status() {
            expected="$1"
            shift
            got=$(curl -sS -o /tmp/matrix-response.json -w '%{http_code}' "$@")
            if [ "$got" != "$expected" ]; then
              echo "Expected HTTP $expected, got $got for: $*"
              cat /tmp/matrix-response.json || true
              exit 1
            fi
          }

          # Role/auth boundary smoke tests. These routes must fail closed before
          # looking up or mutating any caller-supplied resource identifier.
          assert_status 401 http://127.0.0.1:8090/api/owner/vehicles
          assert_status 401 http://127.0.0.1:8090/api/driver/vehicles
          assert_status 401 http://127.0.0.1:8090/api/admin/manage/system-health
          assert_status 401 -X POST -H 'Content-Type: application/json' \
            -d '{"code":"AABBCCDDEEFF0011"}' \
            http://127.0.0.1:8090/api/owner/vehicle-transfers/accept
          assert_status 401 -X POST -H 'Content-Type: application/json' \
            -d '{"token":"MATRIXTEST","vehicleId":"00000000-0000-4000-8000-000000000001"}' \
            http://127.0.0.1:8090/api/qr/activate

          # Towing customer routes must reject anonymous requests before accessing jobs.
          assert_status 401 http://127.0.0.1:8090/api/owner/towing/requests
          assert_status 401 http://127.0.0.1:8090/api/owner/towing/requests/00000000-0000-4000-8000-000000000001
          assert_status 401 http://127.0.0.1:8090/api/owner/towing/requests/00000000-0000-4000-8000-000000000001/tracking
          assert_status 401 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8090/api/owner/towing/requests
          assert_status 401 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8090/api/owner/towing/requests/00000000-0000-4000-8000-000000000001/cancel
          echo "MATRIX_TOWING_ANONYMOUS_BOUNDARIES_OK"

          # Admin towing management must never accept anonymous callers.
          assert_status 401 http://127.0.0.1:8090/api/admin/manage/towing/providers
          assert_status 401 http://127.0.0.1:8090/api/admin/manage/towing/pricing
          assert_status 401 -X PATCH -H 'Content-Type: application/json' -d '{"status":"approved"}' http://127.0.0.1:8090/api/admin/manage/towing/providers/00000000-0000-4000-8000-000000000001/status
          echo "MATRIX_TOWING_ADMIN_AUTH_BOUNDARIES_OK"

          echo "MATRIX_AUTH_BOUNDARIES_OK"

          # F-05: unauthenticated valet endpoints must reject requests.
          assert_status 401 http://127.0.0.1:8090/api/valet/sessions
          assert_status 401 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8090/api/valet/push-token
          echo "MATRIX_VALET_HTTP_AUTH_BOUNDARIES_OK"

          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO business_accounts(id,email,password_hash) VALUES('00000000-0000-4000-8000-000000000551','matrix-valet@test.local','matrix-fixture');
          INSERT INTO businesses(id,account_id,name,category,valet_enabled) VALUES('00000000-0000-4000-8000-000000000552','00000000-0000-4000-8000-000000000551','Matrix Valet','parking',TRUE);
          INSERT INTO valet_staff(id,business_id,name,phone,pin_hash) VALUES('00000000-0000-4000-8000-000000000553','00000000-0000-4000-8000-000000000552','Matrix Valet Staff','+905551112233',encode(digest('246810','sha256'),'hex'));
          SQL

          valet_login_code=$(curl -sS -o /tmp/matrix-valet-login.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"phone":"+905551112233","pin":"246810"}' http://127.0.0.1:8090/api/valet/login)
          test "$valet_login_code" = "200"
          valet_token=$(node -e "const x=require('/tmp/matrix-valet-login.json');process.stdout.write(x.token||'')")
          test -n "$valet_token"
          assert_status 200 -H "Authorization: Bearer $valet_token" http://127.0.0.1:8090/api/valet/sessions

          assert_status 200 -X POST -H "Authorization: Bearer $valet_token" -H 'Content-Type: application/json' -d '{"token":"matrix-fcm-test","deviceId":"matrix-device"}' http://127.0.0.1:8090/api/valet/push-token
          assert_status 200 -X POST -H "Authorization: Bearer $valet_token" http://127.0.0.1:8090/api/valet/logout
          assert_status 401 -H "Authorization: Bearer $valet_token" http://127.0.0.1:8090/api/valet/sessions
          assert_status 401 -X POST -H "Authorization: Bearer $valet_token" -H 'Content-Type: application/json' -d '{"token":"matrix-fcm-test","deviceId":"matrix-device"}' http://127.0.0.1:8090/api/valet/push-token
          valet_push_active=$(psql -h 127.0.0.1 -U postgres -d heycar_matrix -Atqc "SELECT COUNT(*) FROM valet_push_tokens WHERE staff_id='00000000-0000-4000-8000-000000000553' AND active=TRUE")
          test "$valet_push_active" = "0"
          echo "MATRIX_VALET_LOGOUT_HTTP_REVOCATION_OK"

          # Active valet assignment must block logout and preserve the session.
          valet_login_code=$(curl -sS -o /tmp/matrix-valet-relogin.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"phone":"+905551112233","pin":"246810"}' http://127.0.0.1:8090/api/valet/login)
          test "$valet_login_code" = "200"
          valet_token=$(node -e "const x=require('/tmp/matrix-valet-relogin.json');process.stdout.write(x.token||'')")
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO valet_sessions(business_id,staff_id,plate,status)
          VALUES('00000000-0000-4000-8000-000000000552','00000000-0000-4000-8000-000000000553','34MTR551','accepted');
          SQL
          assert_status 409 -X POST -H "Authorization: Bearer $valet_token" http://127.0.0.1:8090/api/valet/logout
          grep -q '"ACTIVE_JOB_EXISTS"' /tmp/matrix-response.json
          assert_status 200 -H "Authorization: Bearer $valet_token" http://127.0.0.1:8090/api/valet/sessions
          echo "MATRIX_VALET_ACTIVE_JOB_LOGOUT_GUARD_OK"

          # Race regression: simultaneous logout requests must not restore a
          # revoked session or leave a push token active.
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE valet_sessions SET status='delivered'
          WHERE staff_id='00000000-0000-4000-8000-000000000553' AND status='accepted';
          SQL
          curl -sS -o /tmp/valet-logout-race-1.json -w '%{http_code}' -X POST -H "Authorization: Bearer $valet_token" http://127.0.0.1:8090/api/valet/logout > /tmp/valet-logout-race-1.code &
          race_pid_1=$!
          curl -sS -o /tmp/valet-logout-race-2.json -w '%{http_code}' -X POST -H "Authorization: Bearer $valet_token" http://127.0.0.1:8090/api/valet/logout > /tmp/valet-logout-race-2.code &
          race_pid_2=$!
          wait "$race_pid_1"
          wait "$race_pid_2"
          test "$(cat /tmp/valet-logout-race-1.code)" = "200"
          test "$(cat /tmp/valet-logout-race-2.code)" = "200"
          assert_status 401 -H "Authorization: Bearer $valet_token" http://127.0.0.1:8090/api/valet/sessions
          remaining_valet_sessions=$(psql -h 127.0.0.1 -U postgres -d heycar_matrix -Atqc "SELECT COUNT(*) FROM valet_staff_sessions WHERE staff_id='00000000-0000-4000-8000-000000000553'")
          test "$remaining_valet_sessions" = "0"
          echo "MATRIX_VALET_CONCURRENT_LOGOUT_OK"
          concurrent_push_active=$(psql -h 127.0.0.1 -U postgres -d heycar_matrix -Atqc "SELECT COUNT(*) FROM valet_push_tokens WHERE staff_id='00000000-0000-4000-8000-000000000553' AND active=TRUE")
          test "$concurrent_push_active" = "0"
          echo "MATRIX_VALET_CONCURRENT_PUSH_REVOCATION_OK"
          assert_status 401 -X POST -H "Authorization: Bearer $valet_token" -H 'Content-Type: application/json' -d '{"token":"matrix-stale-device","deviceId":"matrix-device-2"}' http://127.0.0.1:8090/api/valet/push-token
          echo "MATRIX_VALET_STALE_DEVICE_REJECTED_OK"

          # Concurrent registration and logout: registration may win before
          # revocation or be rejected afterwards, but must never survive logout.
          valet_login_code=$(curl -sS -o /tmp/matrix-valet-race-login.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"phone":"+905551112233","pin":"246810"}' http://127.0.0.1:8090/api/valet/login)
          test "$valet_login_code" = "200"
          valet_token=$(node -e "const x=require('/tmp/matrix-valet-race-login.json');process.stdout.write(x.token||'')")
          test -n "$valet_token"
          curl -sS -o /tmp/valet-race-register.json -w '%{http_code}' -X POST -H "Authorization: Bearer $valet_token" -H 'Content-Type: application/json' -d '{"token":"matrix-race-push","deviceId":"matrix-race-device"}' http://127.0.0.1:8090/api/valet/push-token > /tmp/valet-race-register.code &
          race_register_pid=$!
          curl -sS -o /tmp/valet-race-logout.json -w '%{http_code}' -X POST -H "Authorization: Bearer $valet_token" http://127.0.0.1:8090/api/valet/logout > /tmp/valet-race-logout.code &
          race_logout_pid=$!
          wait "$race_register_pid"
          wait "$race_logout_pid"
          test "$(cat /tmp/valet-race-logout.code)" = "200"
          register_code=$(cat /tmp/valet-race-register.code)
          test "$register_code" = "200" || test "$register_code" = "401"
          assert_status 401 -H "Authorization: Bearer $valet_token" http://127.0.0.1:8090/api/valet/sessions
          race_push_active=$(psql -h 127.0.0.1 -U postgres -d heycar_matrix -Atqc "SELECT COUNT(*) FROM valet_push_tokens WHERE staff_id='00000000-0000-4000-8000-000000000553' AND active=TRUE")
          test "$race_push_active" = "0"
          echo "MATRIX_VALET_REGISTER_LOGOUT_RACE_OK"
          # The same device must not be able to re-register after logout.
          assert_status 401 -X POST -H "Authorization: Bearer $valet_token" -H 'Content-Type: application/json' -d '{"token":"matrix-race-push-retry","deviceId":"matrix-race-device"}' http://127.0.0.1:8090/api/valet/push-token
          race_push_active_after_retry=$(psql -h 127.0.0.1 -U postgres -d heycar_matrix -Atqc "SELECT COUNT(*) FROM valet_push_tokens WHERE staff_id='00000000-0000-4000-8000-000000000553' AND active=TRUE")
          test "$race_push_active_after_retry" = "0"
          echo "MATRIX_VALET_POST_LOGOUT_SAME_DEVICE_REJECTED_OK"







          # Cross-principal regression: a valid Owner session must never authorize
          # another Owner's vehicle resource.
          OWNER2_ID="00000000-0000-4000-8000-000000000112"
          VEHICLE2_ID="00000000-0000-4000-8000-000000000223"
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO users(id,email,phone,display_name,password_hash,role,status,premium)
          VALUES('$OWNER2_ID','matrix-owner2@test.local','+905551234568','Matrix Owner 2',crypt('MatrixPass123!',gen_salt('bf',12)),'user','active',false);
          INSERT INTO vehicles(id,owner_id,plate,make,model,color)
          VALUES('$VEHICLE2_ID','$OWNER2_ID','34MTR998','Matrix','Isolation','Test');
          SQL
          # Seed the first owner before attempting login; the QR fixture below
          # reuses this identity for its vehicle and tag.
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users(id,email,phone,display_name,password_hash,role,status,premium)
          VALUES('00000000-0000-4000-8000-000000000111','matrix-notify@test.local','+905551234567','Matrix Notify',crypt('MatrixPass123!',gen_salt('bf',12)),'user','active',false);
          SQL
          owner1_login=$(curl -sS -o /tmp/owner1-login.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"phone":"+905551234567","password":"MatrixPass123!"}' http://127.0.0.1:8090/api/owner/login-phone)
          test "$owner1_login" = "200"
          owner1_token=$(node -e "const x=require('/tmp/owner1-login.json');process.stdout.write(x.accessToken||'')")
          test -n "$owner1_token"
          owner1_vehicles=$(curl -sS -o /tmp/owner1-vehicles.json -w '%{http_code}' -H "Authorization: Bearer $owner1_token" http://127.0.0.1:8090/api/owner/vehicles)
          test "$owner1_vehicles" = "200"
          VEHICLE2_ID="$VEHICLE2_ID" node -e 'const fs=require("fs");const assert=require("node:assert/strict");const x=JSON.parse(fs.readFileSync("/tmp/owner1-vehicles.json","utf8"));assert.ok(Array.isArray(x.vehicles));assert.ok(!x.vehicles.some(v=>String(v.id)===process.env.VEHICLE2_ID));'
          echo "MATRIX_CROSS_PRINCIPAL_OWNER_ISOLATION_OK"

          # Concurrency regression: DB invariants must reject simultaneous duplicate
          # active assignments even if two application requests race.
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE idx_count int;
          BEGIN
            SELECT count(*) INTO idx_count FROM pg_indexes
             WHERE schemaname='public'
               AND indexname IN ('uq_offer_pending_owner_campaign','towing_one_active_request_per_vehicle');
            IF idx_count <> 2 THEN
              RAISE EXCEPTION 'Concurrency protection indexes missing: %',idx_count;
            END IF;
          END $$;
          SQL
          echo "MATRIX_CONCURRENCY_INVARIANTS_OK"

          # Real public QR notification round-trip. This catches schema drift
          # where application code returns/routes recipient_user_id but a fresh
          # migration chain forgot to create the column.
          OWNER_ID="00000000-0000-4000-8000-000000000111"
          VEHICLE_ID="00000000-0000-4000-8000-000000000222"
          QR_ID="00000000-0000-4000-8000-000000000333"
          QR_TOKEN="MATRIXNOTIFY"

          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO vehicles(id,owner_id,plate,make,model,color)
          VALUES(
            '$VEHICLE_ID',
            '$OWNER_ID',
            '34MTR999',
            'Matrix',
            'Notify',
            'Test'
          );

          INSERT INTO qr_tags(id,token,vehicle_id,status,activated_at,scan_secret)
          VALUES(
            '$QR_ID',
            '$QR_TOKEN',
            '$VEHICLE_ID',
            'active',
            now(),
            'matrix-test-scan-proof'
          );
          SQL

          # Missing proximity proof must not mint a scan session.
          missing_proof_code=$(curl -sS -o /tmp/matrix-no-proof.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:8090/api/qr/$QR_TOKEN/session")
          test "$missing_proof_code" = "428"
          grep -q '"PROXIMITY_PROOF_REQUIRED"' /tmp/matrix-no-proof.json
          # An invalid QR proof must also fail closed.
          invalid_proof_code=$(curl -sS -o /tmp/matrix-invalid-proof.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"scanSecret":"invalid-matrix-proof"}' "http://127.0.0.1:8090/api/qr/$QR_TOKEN/session")
          test "$invalid_proof_code" = "403"
          grep -q '"QR_SCAN_PROOF_INVALID"' /tmp/matrix-invalid-proof.json
          echo "MATRIX_QR_PROXIMITY_NEGATIVE_CASES_OK"

          session_code=$(curl -sS -o /tmp/matrix-session.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H 'X-Proximity-Device: matrix-qr-device' \
            -d '{"scanSecret":"matrix-test-scan-proof","latitude":41.0,"longitude":29.0,"accuracy":15}' \
            "http://127.0.0.1:8090/api/qr/$QR_TOKEN/session")
          if [ "$session_code" != "201" ]; then
            echo "Expected scan session HTTP 201, got $session_code"
            cat /tmp/matrix-session.json || true
            exit 1
          fi

          scan_token=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/matrix-session.json','utf8'));if(!x.scanToken)process.exit(1);process.stdout.write(x.scanToken)")
          test -n "$scan_token"

          notify_code=$(curl -sS -o /tmp/matrix-notification.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Scan-Token: $scan_token" \
            -d '{"type":"lights_on","message":"Matrix notification recipient routing test"}' \
            "http://127.0.0.1:8090/api/qr/$QR_TOKEN/notifications")
          if [ "$notify_code" != "201" ]; then
            echo "Expected notification HTTP 201, got $notify_code"
            cat /tmp/matrix-notification.json || true
            exit 1
          fi

          routed_recipient=$(psql -h 127.0.0.1 -U postgres -d heycar_matrix -Atqc \
            "SELECT recipient_user_id::text FROM vehicle_notifications WHERE qr_token='$QR_TOKEN' ORDER BY created_at DESC LIMIT 1")
          test "$routed_recipient" = "$OWNER_ID"
          grep -q '"recipient_user_id"' /tmp/matrix-notification.json

          # A QR code alone must not authorize anonymous message creation.
          assert_status 401 -X POST -H 'Content-Type: application/json' \
            -d '{"type":"message","message":"unauthorized QR message"}' \
            "http://127.0.0.1:8090/api/qr/$QR_TOKEN/notifications"
          assert_status 401 -X POST -H 'Content-Type: application/json' \
            -H 'X-Scan-Token: invalid-matrix-session' \
            -d '{"type":"message","message":"invalid scan session"}' \
            "http://127.0.0.1:8090/api/qr/$QR_TOKEN/notifications"
          echo "MATRIX_QR_MESSAGE_SCAN_SESSION_HTTP_GUARD_OK"

          # Public call creation must reject an absent or invalid scan session
          # before an anonymous caller can reach a vehicle owner.
          assert_status 401 -X POST -H 'Content-Type: application/json' \
            -d "{\"qrToken\":\"$QR_TOKEN\"}" \
            "http://127.0.0.1:8090/api/public/calls"
          assert_status 401 -X POST -H 'Content-Type: application/json' \
            -H 'X-Scan-Token: invalid-matrix-session' \
            -d "{\"qrToken\":\"$QR_TOKEN\"}" \
            "http://127.0.0.1:8090/api/public/calls"
          echo "MATRIX_PUBLIC_CALL_SCAN_SESSION_HTTP_GUARD_OK"



          echo "MATRIX_NOTIFICATION_RECIPIENT_ROUTING_OK"

          # F-04 HTTP isolation: create a real conversation, then try another owner.
          notification_id=$(psql -h 127.0.0.1 -U postgres -d heycar_matrix -Atqc "SELECT id FROM vehicle_notifications WHERE qr_token='$QR_TOKEN' ORDER BY created_at DESC LIMIT 1")
          test -n "$notification_id"
          conversation_code=$(curl -sS -o /tmp/matrix-conversation.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H "X-Scan-Token: $scan_token" \
            -d "{\"notificationId\":\"$notification_id\"}" \
            "http://127.0.0.1:8090/api/qr/$QR_TOKEN/conversations")
          test "$conversation_code" = "201"
          conversation_id=$(node -e "const x=require('/tmp/matrix-conversation.json');process.stdout.write(String(x.conversation?.id||''))")
          test -n "$conversation_id"

          owner2_login=$(curl -sS -o /tmp/owner2-login.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"phone":"+905551234568","password":"MatrixPass123!"}' http://127.0.0.1:8090/api/owner/login-phone)
          test "$owner2_login" = "200"
          owner2_token=$(node -e "const x=require('/tmp/owner2-login.json');process.stdout.write(x.accessToken||'')")
          test -n "$owner2_token"

          assert_status 200 -H "Authorization: Bearer $owner1_token" "http://127.0.0.1:8090/api/owner/conversations/$conversation_id"
          assert_status 404 -H "Authorization: Bearer $owner2_token" "http://127.0.0.1:8090/api/owner/conversations/$conversation_id"
          assert_status 404 -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $owner2_token" \
            -d '{"message":"cross-owner isolation probe"}' "http://127.0.0.1:8090/api/owner/conversations/$conversation_id/messages"
          assert_status 401 "http://127.0.0.1:8090/api/qr/$QR_TOKEN/conversations/$conversation_id"
          echo "MATRIX_CONVERSATION_HTTP_OWNER_ISOLATION_OK"

          # A separate valid QR scan must not unlock another visitor's conversation.
          second_scan_code=$(curl -sS -o /tmp/matrix-second-scan.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H 'X-Proximity-Device: matrix-second-visitor' \
            -d '{"scanSecret":"matrix-test-scan-proof","latitude":41.0,"longitude":29.0,"accuracy":15}' \
            "http://127.0.0.1:8090/api/qr/$QR_TOKEN/session")
          test "$second_scan_code" = "201"
          second_scan_token=$(node -e "const x=require('/tmp/matrix-second-scan.json');process.stdout.write(x.scanToken||'')")
          test -n "$second_scan_token"
          assert_status 200 -H "X-Scan-Token: $scan_token" "http://127.0.0.1:8090/api/qr/$QR_TOKEN/conversations/$conversation_id"
          assert_status 404 -H "X-Scan-Token: $second_scan_token" "http://127.0.0.1:8090/api/qr/$QR_TOKEN/conversations/$conversation_id"
          assert_status 404 -X POST -H 'Content-Type: application/json' \
            -H "X-Scan-Token: $second_scan_token" \
            -d '{"message":"other visitor access probe"}' \
            "http://127.0.0.1:8090/api/qr/$QR_TOKEN/conversations/$conversation_id/messages"
          echo "MATRIX_CONVERSATION_HTTP_GUEST_ISOLATION_OK"

          # A valid scan session can create a call, but it must not grant
          # access to the call without the distinct per-call visitor token.
          call_create_code=$(curl -sS -o /tmp/matrix-call.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H "X-Scan-Token: $scan_token" \
            -d "{\"qrToken\":\"$QR_TOKEN\"}" \
            "http://127.0.0.1:8090/api/public/calls")
          test "$call_create_code" = "201"
          call_id=$(node -e "const x=require('/tmp/matrix-call.json');process.stdout.write(x.call?.id||'')")
          call_visitor_token=$(node -e "const x=require('/tmp/matrix-call.json');process.stdout.write(x.call?.visitor_token||'')")
          test -n "$call_id"
          test -n "$call_visitor_token"
          call_url="http://127.0.0.1:8090/api/public/calls/$call_id"
          assert_status 200 -H "X-Visitor-Token: $call_visitor_token" "$call_url"
          assert_status 401 "$call_url"
          assert_status 404 -H 'X-Visitor-Token: invalid-other-visitor' "$call_url"
          assert_status 404 -H "X-Visitor-Token: $second_scan_token" "$call_url"
          assert_status 401 -X PATCH -H 'Content-Type: application/json' \
            -d '{"action":"cancel"}' "$call_url"
          assert_status 409 -X PATCH -H 'Content-Type: application/json' \
            -H 'X-Visitor-Token: invalid-other-visitor' \
            -d '{"action":"cancel"}' "$call_url"
          assert_status 200 -H "X-Visitor-Token: $call_visitor_token" "$call_url"
          assert_status 200 -X PATCH -H 'Content-Type: application/json' \
            -H "X-Visitor-Token: $call_visitor_token" \
            -d '{"action":"cancel"}' "$call_url"
          echo "MATRIX_PUBLIC_CALL_VISITOR_HTTP_ISOLATION_OK"

          # Rolling limit applies even after a call is cancelled.
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO anonymous_call_attempts(scan_session_hash)
          SELECT c.scan_session_hash FROM anonymous_calls c
          CROSS JOIN generate_series(1,4) WHERE c.id='$call_id';
          SQL
          call_attempt_count=$(psql -h 127.0.0.1 -U postgres -d heycar_matrix -Atqc "SELECT COUNT(*) FROM anonymous_call_attempts WHERE scan_session_hash=(SELECT scan_session_hash FROM anonymous_calls WHERE id='$call_id') AND attempted_at>NOW()-INTERVAL '10 minutes'")
          test "$call_attempt_count" = "5"
          assert_status 429 -X POST -H 'Content-Type: application/json' \
            -H "X-Scan-Token: $scan_token" \
            -d "{\"qrToken\":\"$QR_TOKEN\"}" \
            "http://127.0.0.1:8090/api/public/calls"
          echo "MATRIX_PUBLIC_CALL_ROLLING_RATE_LIMIT_HTTP_OK"





          # Reset earlier abuse-limit fixture so this test exercises scan validation.
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 -c "DELETE FROM qr_security_request_log WHERE owner_id='$OWNER_ID'"
          # Expired and blocked scan sessions must reject both messages and calls.
          scan_hash=$(node -e "const c=require('crypto');process.stdout.write(c.createHash('sha256').update(process.argv[1]).digest('hex'))" "$scan_token")
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 -c "UPDATE qr_scan_sessions SET expires_at=NOW()-INTERVAL '1 minute' WHERE token_hash='$scan_hash'"
          assert_status 401 -X POST -H "Content-Type: application/json" -H "X-Scan-Token: $scan_token" -d '{"type":"message","message":"expired scan probe"}' "http://127.0.0.1:8090/api/qr/$QR_TOKEN/notifications"
          assert_status 401 -X POST -H "Content-Type: application/json" -H "X-Scan-Token: $scan_token" -d "{\"qrToken\":\"$QR_TOKEN\"}" "http://127.0.0.1:8090/api/public/calls"
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 -c "UPDATE qr_scan_sessions SET expires_at=NOW()+INTERVAL '30 minutes',blocked=TRUE WHERE token_hash='$scan_hash'"
          assert_status 401 -X POST -H "Content-Type: application/json" -H "X-Scan-Token: $scan_token" -d '{"type":"message","message":"blocked scan probe"}' "http://127.0.0.1:8090/api/qr/$QR_TOKEN/notifications"
          assert_status 401 -X POST -H "Content-Type: application/json" -H "X-Scan-Token: $scan_token" -d "{\"qrToken\":\"$QR_TOKEN\"}" "http://127.0.0.1:8090/api/public/calls"
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 -c "UPDATE qr_scan_sessions SET blocked=FALSE WHERE token_hash='$scan_hash'"
          echo "MATRIX_QR_SCAN_EXPIRY_BLOCK_HTTP_OK"

          # Owner credentials cannot be used to access driver conversation endpoints.
          assert_status 401 -H "Authorization: Bearer $owner1_token" "http://127.0.0.1:8090/api/driver/conversations/$conversation_id"
          assert_status 401 -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $owner1_token" \
            -d '{"message":"role isolation probe"}' \
            "http://127.0.0.1:8090/api/driver/conversations/$conversation_id/messages"
          echo "MATRIX_CONVERSATION_HTTP_DRIVER_ROLE_BOUNDARY_OK"

          # Two authenticated drivers must not access each other's conversation.
          DRIVER1_ID="00000000-0000-4000-8000-000000000114"
          DRIVER2_ID="00000000-0000-4000-8000-000000000115"
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO users(id,email,phone,display_name,password_hash,role,status,premium)
          VALUES
            ('$DRIVER1_ID','matrix-driver1@test.local','+905551234571','Matrix Driver 1',crypt('MatrixPass123!',gen_salt('bf',12)),'user','active',false),
            ('$DRIVER2_ID','matrix-driver2@test.local','+905551234572','Matrix Driver 2',crypt('MatrixPass123!',gen_salt('bf',12)),'user','active',false);
          INSERT INTO vehicle_drivers(vehicle_id,owner_id,driver_user_id,driver_name) VALUES
            ('$VEHICLE_ID','$OWNER_ID','$DRIVER1_ID','Matrix Driver 1'),
            ('$VEHICLE2_ID','$OWNER2_ID','$DRIVER2_ID','Matrix Driver 2');
          UPDATE vehicle_notifications SET recipient_user_id='$DRIVER1_ID' WHERE id='$notification_id';
          SQL

          driver1_login=$(curl -sS -o /tmp/matrix-driver1-login.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"phone":"+905551234571","password":"MatrixPass123!"}' \
            http://127.0.0.1:8090/api/driver/login-phone)
          test "$driver1_login" = "200"
          driver1_token=$(node -e "const x=require('/tmp/matrix-driver1-login.json');process.stdout.write(x.accessToken||'')")
          test -n "$driver1_token"

          driver2_login=$(curl -sS -o /tmp/matrix-driver2-login.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"phone":"+905551234572","password":"MatrixPass123!"}' \
            http://127.0.0.1:8090/api/driver/login-phone)
          test "$driver2_login" = "200"
          driver2_token=$(node -e "const x=require('/tmp/matrix-driver2-login.json');process.stdout.write(x.accessToken||'')")
          test -n "$driver2_token"

          assert_status 200 -H "Authorization: Bearer $driver1_token" \
            "http://127.0.0.1:8090/api/driver/conversations/$conversation_id"
          assert_status 404 -H "Authorization: Bearer $driver2_token" \
            "http://127.0.0.1:8090/api/driver/conversations/$conversation_id"
          assert_status 404 -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $driver2_token" \
            -d '{"message":"other driver isolation probe"}' \
            "http://127.0.0.1:8090/api/driver/conversations/$conversation_id/messages"
          echo "MATRIX_CONVERSATION_HTTP_DRIVER_ISOLATION_OK"





          # CORS must fail closed for unknown browser origins while preserving
          # the canonical GitHub Pages origin used by the public/admin web apps.
          cors_allowed=$(curl -sS -o /tmp/cors-allowed.json -w '%{http_code}'             -H 'Origin: https://queensho.github.io'             http://127.0.0.1:8090/health)
          test "$cors_allowed" = "200"

          cors_denied=$(curl -sS -o /tmp/cors-denied.json -w '%{http_code}'             -H 'Origin: https://evil.example'             http://127.0.0.1:8090/health)
          test "$cors_denied" = "403"
          grep -q '"CORS_ORIGIN_DENIED"' /tmp/cors-denied.json
          echo "MATRIX_CORS_FAIL_CLOSED_OK"

          # Owner login must not reveal whether a valid phone exists, and must
          # throttle repeated password guessing from one source address.
          owner_known=$(curl -sS -o /tmp/owner-known.json -w '%{http_code}'             -X POST -H 'Content-Type: application/json'             -d '{"phone":"+905551234567","password":"WrongPass123!"}'             http://127.0.0.1:8090/api/owner/login-phone)
          owner_missing=$(curl -sS -o /tmp/owner-missing.json -w '%{http_code}'             -X POST -H 'Content-Type: application/json'             -d '{"phone":"+905559999999","password":"WrongPass123!"}'             http://127.0.0.1:8090/api/owner/login-phone)
          test "$owner_known" = "401"
          test "$owner_missing" = "401"
          grep -q '"INVALID_CREDENTIALS"' /tmp/owner-known.json
          grep -q '"INVALID_CREDENTIALS"' /tmp/owner-missing.json

          for i in $(seq 1 8); do
            code=$(curl -sS -o /tmp/owner-rate.json -w '%{http_code}'               -X POST -H 'Content-Type: application/json'               -d '{"phone":"+905559999999","password":"WrongPass123!"}'               http://127.0.0.1:8090/api/owner/login-phone)
            test "$code" = "401"
          done
          owner_limited=$(curl -sS -o /tmp/owner-limited.json -w '%{http_code}'             -X POST -H 'Content-Type: application/json'             -d '{"phone":"+905559999999","password":"WrongPass123!"}'             http://127.0.0.1:8090/api/owner/login-phone)
          test "$owner_limited" = "429"
          grep -q '"TOO_MANY_ATTEMPTS"' /tmp/owner-limited.json
          echo "MATRIX_OWNER_LOGIN_HARDENING_OK"

          # Driver password login has an independent limiter.
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/driver-rate.json -w '%{http_code}'               -X POST -H 'Content-Type: application/json'               -d '{"phone":"+905558888888","password":"WrongPass123!"}'               http://127.0.0.1:8090/api/driver/login-phone)
            test "$code" = "401"
          done
          driver_limited=$(curl -sS -o /tmp/driver-limited.json -w '%{http_code}'             -X POST -H 'Content-Type: application/json'             -d '{"phone":"+905558888888","password":"WrongPass123!"}'             http://127.0.0.1:8090/api/driver/login-phone)
          test "$driver_limited" = "429"
          grep -q '"TOO_MANY_ATTEMPTS"' /tmp/driver-limited.json
          echo "MATRIX_DRIVER_LOGIN_RATE_LIMIT_OK"

          # Real QR message requests must be blocked when the owner's
          # per-visitor abuse window is exhausted, even with a valid scan token.
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO owner_privacy_settings(owner_id,qr_abuse_protection)
          VALUES('$OWNER_ID',TRUE)
          ON CONFLICT(owner_id) DO UPDATE SET qr_abuse_protection=TRUE;
          DELETE FROM qr_security_request_log WHERE owner_id='$OWNER_ID';
          SQL
          assert_status 201 -X POST -H 'Content-Type: application/json' \
            -H "X-Scan-Token: $scan_token" \
            -d '{"type":"message","message":"Matrix message rate-limit baseline"}' \
            "http://127.0.0.1:8090/api/qr/$QR_TOKEN/notifications"
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO qr_security_request_log(owner_id,qr_token,visitor_key)
          SELECT '$OWNER_ID','$QR_TOKEN',visitor_key
          FROM qr_security_request_log WHERE owner_id='$OWNER_ID'
          ORDER BY created_at DESC LIMIT 1;
          SQL
          # Fill the window using the same visitor identity captured by HTTP.
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO qr_security_request_log(owner_id,qr_token,visitor_key)
          SELECT '$OWNER_ID','$QR_TOKEN',visitor_key
          FROM (SELECT visitor_key FROM qr_security_request_log
                WHERE owner_id='$OWNER_ID' ORDER BY created_at DESC LIMIT 1) v
          CROSS JOIN generate_series(1,100);
          SQL
          assert_status 429 -X POST -H 'Content-Type: application/json' \
            -H "X-Scan-Token: $scan_token" \
            -d '{"type":"message","message":"Matrix spam message should be denied"}' \
            "http://127.0.0.1:8090/api/qr/$QR_TOKEN/notifications"
          echo "MATRIX_QR_MESSAGE_RATE_LIMIT_HTTP_OK"

          # Vehicle transfer must revoke old scan sessions and private visitor data.
          # Run last: transfer intentionally deletes existing conversation/call fixtures.
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 -c "DELETE FROM qr_security_request_log WHERE owner_id='$OWNER_ID'"
          transfer_new_owner="$OWNER2_ID"
          # Seed an unused driver invite before transfer; it must be revoked.
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO vehicle_driver_invites(vehicle_id,owner_id,token,expires_at)
          VALUES('$VEHICLE_ID','$OWNER_ID','PQMATRX2',NOW()+INTERVAL '1 day');
          SQL
          assert_status 200 "http://127.0.0.1:8090/api/driver/invites/PQMATRX2"
          # Exercise full production transfer finalization, including driver revocation.
          VEHICLE_ID="$VEHICLE_ID" NEW_OWNER="$transfer_new_owner" node - <<'NODE'
          const {Pool}=require("pg");
          const {finalizeVehicleTransfer}=require("./vehicle-transfer-service");
          (async()=>{
            const pool=new Pool({host:"127.0.0.1",user:"postgres",password:"postgres",database:"heycar_matrix"});
            const db=await pool.connect();
            try {
              await db.query("BEGIN");
              const transfer=await db.query("INSERT INTO vehicle_transfers(vehicle_id,from_owner_id,transfer_code,expires_at) SELECT id,owner_id,$2,NOW()+INTERVAL '1 day' FROM vehicles WHERE id=$1 RETURNING id",[process.env.VEHICLE_ID,"MATRIXTRANSFERDRIVER"]);
              if(!transfer.rows.length)throw new Error("TRANSFER_FIXTURE_MISSING");
              const result=await finalizeVehicleTransfer(db,{vehicleId:process.env.VEHICLE_ID,transferId:transfer.rows[0].id,newOwnerId:process.env.NEW_OWNER});
              if(!(result.privateReset.scanSessions>=2))throw new Error("TRANSFER_SCAN_SESSIONS_NOT_REVOKED");
              await db.query("COMMIT");
            }catch(e){await db.query("ROLLBACK");throw e;}
            finally{db.release();await pool.end();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          assert_status 401 -X POST -H "Content-Type: application/json" -H "X-Scan-Token: $scan_token" -d '{"type":"message","message":"old owner scan after transfer"}' "http://127.0.0.1:8090/api/qr/$QR_TOKEN/notifications"
          assert_status 401 -X POST -H "Content-Type: application/json" -H "X-Scan-Token: $scan_token" -d "{\"qrToken\":\"$QR_TOKEN\"}" "http://127.0.0.1:8090/api/public/calls"
          assert_status 401 -X POST -H "Content-Type: application/json" -H "X-Scan-Token: $second_scan_token" -d '{"type":"message","message":"second old visitor after transfer"}' "http://127.0.0.1:8090/api/qr/$QR_TOKEN/notifications"
          echo "MATRIX_VEHICLE_TRANSFER_QR_REVOCATION_HTTP_OK"

          # Previously issued owner JWT must not retain transferred vehicle access.
          assert_status 403 -X PUT -H "Content-Type: application/json" -H "Authorization: Bearer $owner1_token" -d '{"plate":"34MTR999","make":"Matrix","model":"Notify"}' "http://127.0.0.1:8090/api/owner/vehicles/$VEHICLE_ID"
          assert_status 404 -X DELETE -H "Authorization: Bearer $owner1_token" "http://127.0.0.1:8090/api/owner/vehicles/$VEHICLE_ID"
          assert_status 404 -X POST -H "Authorization: Bearer $owner1_token" "http://127.0.0.1:8090/api/owner/vehicles/$VEHICLE_ID/transfer"
          assert_status 200 -H "Authorization: Bearer $owner1_token" "http://127.0.0.1:8090/api/owner/vehicles"
          VEHICLE_ID="$VEHICLE_ID" node -e 'const fs=require("fs");const assert=require("node:assert/strict");const x=JSON.parse(fs.readFileSync("/tmp/matrix-response.json","utf8"));assert.ok(Array.isArray(x.vehicles));assert.ok(!x.vehicles.some(v=>String(v.id)===process.env.VEHICLE_ID),"Transferred vehicle exposed to previous owner");'
          # Reuse the new owner JWT minted earlier: repeat login can hit auth rate limits.
          test -n "$owner2_token"
          assert_status 200 -H "Authorization: Bearer $owner2_token" "http://127.0.0.1:8090/api/owner/vehicles"
          VEHICLE_ID="$VEHICLE_ID" node -e 'const fs=require("fs");const assert=require("node:assert/strict");const x=JSON.parse(fs.readFileSync("/tmp/matrix-response.json","utf8"));assert.ok(x.vehicles.some(v=>String(v.id)===process.env.VEHICLE_ID),"Transferred vehicle missing for new owner");'
          echo "MATRIX_TRANSFER_OLD_OWNER_HTTP_ISOLATION_OK"

          # Old driver JWT remains cryptographically valid but must lose vehicle access.
          assert_status 200 -H "Authorization: Bearer $driver1_token" "http://127.0.0.1:8090/api/driver/vehicles"
          VEHICLE_ID="$VEHICLE_ID" node -e 'const fs=require("fs");const assert=require("node:assert/strict");const x=JSON.parse(fs.readFileSync("/tmp/matrix-response.json","utf8"));assert.ok(Array.isArray(x.vehicles));assert.ok(!x.vehicles.some(v=>String(v.vehicle_id)===process.env.VEHICLE_ID),"Transferred vehicle exposed to former driver");'
          assert_status 403 -H "Authorization: Bearer $driver1_token" "http://127.0.0.1:8090/api/driver/vehicles/$VEHICLE_ID/park-note"
          assert_status 403 -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $driver1_token" -d '{"message":"unauthorized after transfer"}' "http://127.0.0.1:8090/api/driver/vehicles/$VEHICLE_ID/park-note"
          # Other driver's independent vehicle assignment must survive the transfer.
          assert_status 200 -H "Authorization: Bearer $driver2_token" "http://127.0.0.1:8090/api/driver/vehicles"
          VEHICLE2_ID="$VEHICLE2_ID" node -e 'const fs=require("fs");const assert=require("node:assert/strict");const x=JSON.parse(fs.readFileSync("/tmp/matrix-response.json","utf8"));assert.ok(x.vehicles.some(v=>String(v.vehicle_id)===process.env.VEHICLE2_ID),"Unrelated driver assignment was lost");'
          echo "MATRIX_TRANSFER_DRIVER_HTTP_ISOLATION_OK"
          # Transfer must erase old notifications/conversations for all principals.
          assert_status 404 -H "Authorization: Bearer $driver1_token" "http://127.0.0.1:8090/api/driver/conversations/$conversation_id"
          assert_status 404 -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $driver1_token" -d '{"message":"former driver must be denied"}' "http://127.0.0.1:8090/api/driver/conversations/$conversation_id/messages"
          assert_status 200 -H "Authorization: Bearer $driver1_token" "http://127.0.0.1:8090/api/driver/notifications"
          VEHICLE_ID="$VEHICLE_ID" node -e 'const fs=require("fs");const assert=require("node:assert/strict");const x=JSON.parse(fs.readFileSync("/tmp/matrix-response.json","utf8"));assert.ok(!x.notifications.some(n=>String(n.vehicle_id)===process.env.VEHICLE_ID),"Old driver still sees transferred vehicle notifications");'
          assert_status 404 -H "Authorization: Bearer $owner1_token" "http://127.0.0.1:8090/api/owner/conversations/$conversation_id"
          assert_status 404 -H "Authorization: Bearer $owner2_token" "http://127.0.0.1:8090/api/owner/conversations/$conversation_id"
          VEHICLE_ID="$VEHICLE_ID" node - <<'NODE'
          const assert=require("node:assert/strict");
          const {Pool}=require("pg");
          (async()=>{
            const p=new Pool({host:"127.0.0.1",user:"postgres",password:"postgres",database:"heycar_matrix"});
            try{
              for(const table of ["qr_conversations","vehicle_notifications","anonymous_calls","vehicle_drivers","vehicle_active_drivers"]){
                const r=await p.query("SELECT COUNT(*)::int AS count FROM "+table+" WHERE vehicle_id::text=$1",[process.env.VEHICLE_ID]);
                assert.equal(r.rows[0].count,0,table+" must have no prior private records");
              }
            }finally{await p.end();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo "MATRIX_TRANSFER_PRIVATE_HISTORY_HTTP_ISOLATION_OK"
          # A former invite must not attach a driver to the transferred vehicle.
          assert_status 410 "http://127.0.0.1:8090/api/driver/invites/PQMATRX2"
          assert_status 410 -X POST -H "Content-Type: application/json" -d '{"phone":"+905551234571","password":"MatrixPass123!","displayName":"Matrix Driver 1","legalAccepted":true,"legalVersion":"1.0"}' "http://127.0.0.1:8090/api/driver/invites/PQMATRX2/accept"
          assert_status 200 -H "Authorization: Bearer $driver1_token" "http://127.0.0.1:8090/api/driver/vehicles"
          VEHICLE_ID="$VEHICLE_ID" node -e 'const fs=require("fs");const assert=require("node:assert/strict");const x=JSON.parse(fs.readFileSync("/tmp/matrix-response.json","utf8"));assert.ok(!x.vehicles.some(v=>String(v.vehicle_id)===process.env.VEHICLE_ID),"Former driver reattached via revoked invite");'
          echo "MATRIX_TRANSFER_DRIVER_INVITE_REVOKED_HTTP_OK"
          # The former owner cannot mint driver invites after the transfer.
          assert_status 404 -X POST -H "Authorization: Bearer $owner1_token" "http://127.0.0.1:8090/api/owner/vehicles/$VEHICLE_ID/driver-invites"
          # The new owner can mint a fresh invitation for this vehicle.
          assert_status 201 -X POST -H "Authorization: Bearer $owner2_token" "http://127.0.0.1:8090/api/owner/vehicles/$VEHICLE_ID/driver-invites"
          new_owner_invite=$(node -e 'const fs=require("fs");const assert=require("node:assert/strict");const x=JSON.parse(fs.readFileSync("/tmp/matrix-response.json","utf8"));assert.equal(x.ok,true);assert.match(x.code,/^PQ[A-Z2-9]{6}$/);process.stdout.write(x.code);')
          assert_status 200 "http://127.0.0.1:8090/api/driver/invites/$new_owner_invite"
          # The new invitation must belong to the transferred vehicle and current owner.
          VEHICLE_ID="$VEHICLE_ID" OWNER2_ID="$OWNER2_ID" NEW_INVITE="$new_owner_invite" node - <<'NODE'
          const assert=require("node:assert/strict");
          const {Pool}=require("pg");
          (async()=>{
            const p=new Pool({host:"127.0.0.1",user:"postgres",password:"postgres",database:"heycar_matrix"});
            try{
              const r=await p.query("SELECT vehicle_id::text,owner_id::text,accepted_at,expires_at>NOW() AS valid FROM vehicle_driver_invites WHERE token=$1",[process.env.NEW_INVITE]);
              assert.equal(r.rowCount,1);
              assert.equal(r.rows[0].vehicle_id,process.env.VEHICLE_ID);
              assert.equal(r.rows[0].owner_id,process.env.OWNER2_ID);
              assert.equal(r.rows[0].accepted_at,null);
              assert.equal(r.rows[0].valid,true);
            }finally{await p.end();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo "MATRIX_TRANSFER_NEW_OWNER_INVITE_AUTHORITY_HTTP_OK"



          # Public QR resolution must throttle enumeration attempts.
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/qr-resolve.json -w '%{http_code}'               "http://127.0.0.1:8090/api/qr/$QR_TOKEN")
            test "$code" = "200"
          done
          qr_resolve_limited=$(curl -sS -o /tmp/qr-resolve-limited.json -w '%{http_code}'             "http://127.0.0.1:8090/api/qr/$QR_TOKEN")
          test "$qr_resolve_limited" = "429"
          echo "MATRIX_PUBLIC_QR_RESOLVE_RATE_LIMIT_OK"

          # Invalid tokens previously bypassed owner-scoped QR abuse controls.
          # Four scan-session requests were already made above (two rejected
          # proximity probes and two successful sessions). Sixteen more
