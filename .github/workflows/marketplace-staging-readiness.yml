name: Marketplace Staging Readiness
on:
  workflow_call:
    inputs:
      verify_backup:
        description: Verify a fresh backup and rehearse repairs only in an isolated restore
        type: boolean
        default: true
  push:
    branches: [integration/marketplace-main-20261031]
    paths:
      - 'deploy/marketplace-staging-preflight.js'
      - 'deploy/marketplace-staging-backup.js'
      - 'deploy/marketplace-staging-recovery.js'
      - 'deploy/staging-db/**'
      - 'server/tests/marketplace-staging-backup.test.js'
      - 'server/marketplace-schema.js'
      - '.github/workflows/marketplace-staging-readiness.yml'
  workflow_dispatch:
    inputs:
      verify_backup:
        description: Verify backup and rehearse least-privilege repair SQL only on the restore
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cepqontag-staging-deploy
  cancel-in-progress: false
jobs:
  backup-tool-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heycar_matrix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d heycar_matrix"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: heycar_matrix
      BACKUP_PG_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix server --ignore-scripts --no-audit --no-fund
      - name: Ensure PostgreSQL 16 command-line tools
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-16 postgresql-client-16
          fi
      - name: Prove dump, snapshot and full restore on disposable PostgreSQL
        run: node --test server/tests/marketplace-staging-backup.test.js server/tests/marketplace-staging-preflight.test.js

      - name: Build an authoritative candidate schema on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d heycar_matrix -v ON_ERROR_STOP=1 -c "CREATE ROLE heycar_user LOGIN PASSWORD 'reference-test-only'"
          createdb -h 127.0.0.1 -U postgres heycar_reference_test
          DB_NAME=heycar_reference_test node server/migrate.js --expect-database=heycar_reference_test
          SCHEMA_AUDIT_ALL=1 DB_NAME=heycar_reference_test node server/marketplace-schema.js > expected-marketplace-schema.json
      - name: Test constrained migration capability and data-preserving repair guards on PostgreSQL 16
        env:
          STAGING_DB_REHEARSAL_TEST: '1'
        run: node --test deploy/staging-db/inspection.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: expected-marketplace-schema
          path: expected-marketplace-schema.json
          retention-days: 7

  staging-readonly-preflight:
    name: Staging read-only audit, isolated repair rehearsal and readiness
    needs: backup-tool-test
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: expected-marketplace-schema
      - name: Prepare read-only live/candidate schema comparison
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          reference=json.loads(Path('expected-marketplace-schema.json').read_text())
          source=Path('deploy/marketplace-staging-preflight.js').read_text()
          schema_module=Path('server/marketplace-schema.js').read_text()
          inspection=Path('deploy/staging-db/inspection.js').read_text()
          inspection_prefix='const inspectionTools=(()=>{const module={exports:{}};\n'+inspection+'\nreturn module.exports;})();\n'
          prefix='const schemaTools=(()=>{const module={exports:{}};\n'+schema_module+'\nreturn module.exports;})();\n'
          # The embedded module must not run its CLI main branch.
          prefix=prefix.replace('if(require.main===module){','if(false){')
          source=source.replace("const crypto=require('node:crypto');", "const crypto=require('node:crypto');\n"+prefix+inspection_prefix)
          source=source.replace("require('./staging-db/inspection')",'inspectionTools')
          marker='  report.database=id.database;'
          comparison='  report.candidate_schema_differences=schemaTools.compareSchema('+json.dumps(reference)+',await schemaTools.readSchema(client,null));\n'
          # Finish the inspection transaction before the schema helper opens its own read-only snapshot.
          source=source.replace(" }finally{await client.query('ROLLBACK');}"," }finally{await client.query('ROLLBACK');}\n"+comparison)
          Path('staging-preflight-bundle.js').write_text(source)
          backup=Path('deploy/marketplace-staging-backup.js').read_text()
          backup=backup.replace("if(require.main===module||process.argv.includes('--run-staging-backup'))",'if(false)')
          recovery=Path('deploy/marketplace-staging-recovery.js').read_text()
          recovery=recovery.replace("require('./marketplace-staging-backup')",'backupTools')
          recovery=recovery.replace("require('./staging-db/inspection')",'inspectionTools')
          recovery=recovery.replace('sqlTemplate:loadTemplate()','sqlTemplate:recoveryTemplate')
          template='const recoveryTemplate='+json.dumps(Path('deploy/staging-db/least-privilege.sql').read_text())+';\n'
          Path('staging-recovery-bundle.js').write_text('const backupTools=(()=>{const module={exports:{}};\n'+backup+'\nreturn module.exports;})();\n'+inspection_prefix+template+recovery)
          PYTHON
      - name: Verify staging SSH credentials and host identity
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          FINGERPRINT: ${{ secrets.STAGING_SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_KEY SSH_HOST SSH_PORT SSH_USER FINGERPRINT; do
            if [ -z "${!name}" ]; then echo "::error::Missing staging credential: $name"; exit 1; fi
          done
          test "$SSH_USER" = cepqontag-deploy
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/staging_key"
          chmod 600 "$HOME/.ssh/staging_key"
          ssh-keyscan -T 10 -t ed25519 -p "$SSH_PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          actual=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')
          test "$actual" = "$FINGERPRINT"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Audit staging without deployment, migration or baseline
        id: audit
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/staging_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /home/cepqontag-deploy/app/server && node - --run-staging-preflight' \
            < staging-preflight-bundle.js > staging-readiness.json
      - name: Summarize read-only audit without exposing credentials
        id: summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import difflib, hashlib, json, os
          from pathlib import Path
          try:
              report=json.loads(Path('staging-readiness.json').read_text())
          except (OSError, ValueError):
              print('STAGING_AUDIT_NOT_AVAILABLE')
          else:
              print(json.dumps({key:report.get(key) for key in ['database','blockers','backups','http','restore_capabilities']},indent=2))
              print('DEPLOYED_MIGRATION_COUNT',len(report.get('migrations',[])))
              print('TRACKED_MIGRATION_COUNT',len(report.get('tracking',[])))
              deployed={row['filename']:row['sha256'] for row in report.get('migrations',[])}
              candidate={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('server/migrations').glob('*.sql')}
              print('MIGRATION_DIFF',json.dumps({
                  'only_deployed':sorted(deployed.keys()-candidate.keys()),
                  'only_candidate':sorted(candidate.keys()-deployed.keys()),
                  'changed_common':sorted(n for n in deployed.keys() & candidate.keys() if deployed[n]!=candidate[n])}))
              checksums=[{'filename':n,'candidate_sha256':candidate[n],'deployed_sha256':deployed[n]}
                 for n in sorted(deployed.keys() & candidate.keys()) if deployed[n]!=candidate[n]]
              mappings=[]
              for old,new,suffix in [(123,128,'services'),(124,129,'weekly_hours'),(125,130,'reviews'),(126,131,'service_images'),(127,132,'moderation')]:
                  a=f'{old}_marketplace_{suffix}.sql'; b=f'{new}_marketplace_{suffix}.sql'
                  mappings.append({'deployed':a,'candidate':b,'deployed_sha256':deployed.get(a),'candidate_sha256':candidate.get(b),'same_bytes':deployed.get(a)==candidate.get(b)})
              selected={'vehicle_custom_reminders','vehicle_custom_reminder_deliveries'}
              custom_differences=[d for d in report.get('candidate_schema_differences',[]) if d['key'].split('.')[0] in selected]
              manifest={'baseline_written':False,'changed_common':checksums,'marketplace_filename_map':mappings,
                  'custom_reminder_file':{'filename':'123_vehicle_custom_reminders.sql','candidate_sha256':candidate.get('123_vehicle_custom_reminders.sql'),
                    'deployed_filename_present':'123_vehicle_custom_reminders.sql' in deployed,'schema_differences':custom_differences,
                    'acl':report.get('recovery_diagnostics',{}).get('custom_reminder_acl'),
                    'sequence':report.get('recovery_diagnostics',{}).get('custom_reminder_sequence'),
                    'execution_history':'unknown_do_not_claim_executed'}}
              Path('migration-baseline-review.json').write_text(json.dumps(manifest,indent=2))
              print('MIGRATION_BASELINE_REVIEW',json.dumps(manifest))
              print('CANDIDATE_SCHEMA_DIFFERENCES',json.dumps(report.get('candidate_schema_differences',[])))
              diagnostics=report.get('recovery_diagnostics',{})
              deployed_cleanup=diagnostics.pop('cleanup047','')
              print('RECOVERY_DIAGNOSTICS',json.dumps(diagnostics))
              expected_cleanup=Path('server/migrations/047_cleanup_deleted_vehicle_dependents.sql').read_text()
              print('CLEANUP047_DIFF',''.join(difflib.unified_diff(expected_cleanup.splitlines(True),deployed_cleanup.splitlines(True),fromfile='candidate047',tofile='deployed047')))
              print('TABLES_PRESENT',json.dumps(report.get('schema',{}).get('tables',[])))
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  out.write('identity_verified='+str(report.get('database')=='heycar_staging').lower()+'\n')
          PYTHON
      - name: Back up, verify restore and rehearse repairs only inside the isolated copy
        if: steps.summary.outputs.identity_verified == 'true' && (inputs.verify_backup == true || github.event_name == 'push')
        id: backup
        continue-on-error: true
        env:
          RESTORE_DB_NAME: ${{ vars.STAGING_RESTORE_DB_NAME }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RESTORE_DB_NAME" ]; then
            [[ "$RESTORE_DB_NAME" =~ ^heycar_recovery_test_[0-9a-f]{16}$ ]]
          fi
          ssh -i "$HOME/.ssh/staging_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd /home/cepqontag-deploy/app/server && STAGING_RESTORE_DB_NAME='$RESTORE_DB_NAME' node - --run-staging-recovery" \
            < staging-recovery-bundle.js > staging-backup-verification.json
      - name: Re-audit live staging to verify no source changes after isolated rehearsal
        if: always() && steps.summary.outputs.identity_verified == 'true'
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          ssh -i "$HOME/.ssh/staging_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /home/cepqontag-deploy/app/server && node - --run-staging-preflight' \
            < staging-preflight-bundle.js > staging-readiness-after-recovery.json
      - name: Summarize backup and keep the deployment gate closed on unresolved history
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          try:
              report=json.loads(Path('staging-backup-verification.json').read_text())
          except (OSError, ValueError):
              print('STAGING_BACKUP_VERIFICATION_NOT_AVAILABLE')
          else:
              print(json.dumps({key:report.get(key) for key in ['database','directory','backup_complete','dump_sha256','dump_bytes','restore_database','restore_mode','restore_cluster','restore_cluster_stopped','private_restore_phase','restore_verified','offhost_backup_verified','mode','source_modified','source_row_data_modified','rehearsal','owner_bootstrap_installed_live','baseline_applied','phone_index_created','remaining','blockers']},indent=2))
          after=Path('staging-readiness-after-recovery.json')
          if after.exists():
              result=json.loads(after.read_text())
              print('AFTER_RECOVERY_SCHEMA_DIFFERENCES',json.dumps(result.get('candidate_schema_differences',[])))
              diagnostics=result.get('recovery_diagnostics',{})
              diagnostics.pop('cleanup047',None)
              print('AFTER_RECOVERY_DIAGNOSTICS',json.dumps(diagnostics))
          print('No deployment, data repair, baseline or service restart. Failed password/phone controls block release.')
          PYTHON
          exit 1
      - name: Preserve staging audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-staging-readiness
          path: |
            staging-readiness.json
            staging-backup-verification.json
            staging-readiness-after-recovery.json
            migration-baseline-review.json
          if-no-files-found: ignore
          retention-days: 7
