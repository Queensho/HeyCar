name: Build CepQontag Vale APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/valet_main.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/valet-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cepqontag-vale-apk
  cancel-in-progress: true

jobs:
  build-valet-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name vale --org com.cepqontag --no-pub

      - name: Restore Vale Firebase Android config
        env:
          VALE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.VALE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -e
          test -n "$VALE_GOOGLE_SERVICES_JSON_B64"
          printf '%s' "$VALE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('android/app/google-services.json').read_text())
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in data.get('client',[])]
          if 'com.cepqontag.vale' not in packages:
            raise SystemExit('Firebase config package mismatch: com.cepqontag.vale not found')
          print('Vale Firebase config restored for com.cepqontag.vale')
          PY

      - name: Set Vale app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          if 'com.google.gms.google-services' not in s:
            s=s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.4"', 1)
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
            s=s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in s:
            if 'dependencies {' in s:
              s=s.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")', 1)
            else:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml')
          s=m.read_text().replace('android:label="cepqontag_vale"', 'android:label="CepQontag Vale"')
          if 'android.permission.POST_NOTIFICATIONS' not in s:
            s=s.replace('<application', '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          m.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Vale entrypoint
        run: flutter analyze lib/valet_main.dart --no-fatal-infos --no-fatal-warnings

      - name: Build CepQontag Vale APK
        run: flutter build apk --debug --target lib/valet_main.dart

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/CepQontag-Vale.apk

      - name: Upload CepQontag Vale APK
        uses: actions/upload-artifact@v4
        with:
          name: cepqontag-vale-apk
          path: build/app/outputs/flutter-apk/CepQontag-Vale.apk
          retention-days: 14
          if-no-files-found: error
