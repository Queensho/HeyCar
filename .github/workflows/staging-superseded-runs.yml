name: Superseded staging test cleanup
on:
  push:
    branches: [feature/isolated-marketplace-staging-20261025]
permissions:
  contents: read
  actions: write
jobs:
  cancel-superseded-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop superseded staging test runs after server mutation has finished
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const base='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function get(path){const r=await fetch(base+path,{headers});if(!r.ok)throw Error('GitHub request failed: '+r.status);return r.json();}
          (async()=>{
            const result=await get('/actions/workflows/isolated-staging.yml/runs?branch=feature/isolated-marketplace-staging-20261025&per_page=20');
            for(const run of result.workflow_runs){
              if(run.head_sha===process.env.GITHUB_SHA||!['in_progress','queued','pending','waiting'].includes(run.status))continue;
              let safe=false;
              for(let i=0;i<60;i++){
                const jobs=await get('/actions/runs/'+run.id+'/jobs');
                if(!jobs.jobs.some(j=>j.name==='staging-backend'&&j.status==='in_progress')){safe=true;break;}
                await new Promise(resolve=>setTimeout(resolve,2000));
              }
              if(!safe)continue;
              const response=await fetch(base+'/actions/runs/'+run.id+'/cancel',{method:'POST',headers});
              if(![202,409].includes(response.status))throw Error('Staging test cancellation failed: '+response.status);
              console.log('Superseded staging test run stopped: '+run.id);
            }
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
