name: Deploy HeyCar Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: heycar-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Cepqar frontend branding
        run: python3 tool/brand_frontend.py

      - name: Apply owner light theme
        run: python3 tool/owner_light_theme_patch.py

      - name: Apply maintenance light theme
        run: python3 tool/maintenance_light_theme_patch.py

      - name: Apply public visitor light dark theme
        run: python3 tool/public_visitor_theme_patch.py

      - name: Apply driver light dark theme
        run: python3 tool/driver_theme_patch.py

      - name: Match owner header to driver
        run: python3 tool/owner_header_size_patch.py

      - name: Generate web platform
        run: flutter create . --platforms=web --project-name heycar_app --org com.heycar --no-pub

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build public QR website
        run: |
          flutter build web --release --target lib/web_main.dart --base-href "/HeyCar/" --pwa-strategy=none
          rm -f build/web/flutter_service_worker.js build/web/version.json
          mkdir -p deploy
          cp -R build/web/. deploy/

      - name: Build vehicle owner web preview
        run: |
          flutter build web --release --target lib/entry_theme_live.dart --base-href "/HeyCar/owner/" --pwa-strategy=none
          rm -f build/web/flutter_service_worker.js build/web/version.json
          mkdir -p deploy/owner
          cp -R build/web/. deploy/owner/

      - name: Build admin panel
        run: |
          flutter build web --release --target lib/admin_v3.dart --base-href "/HeyCar/admin/" --pwa-strategy=none
          rm -f build/web/flutter_service_worker.js build/web/version.json
          mkdir -p deploy/admin
          cp -R build/web/. deploy/admin/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
