name: Isolated Marketplace Staging
on:
  push:
    branches: [feature/isolated-marketplace-staging-20261025]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-marketplace-staging
  cancel-in-progress: false
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify staging SSH identity
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          FINGERPRINT: ${{ secrets.STAGING_SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_KEY SSH_HOST SSH_PORT SSH_USER FINGERPRINT; do
            if [ -z "${!name}" ]; then echo "::error::Missing staging binding: $name"; exit 1; fi
          done
          test "$SSH_USER" = cepqontag-deploy
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 10 -t ed25519 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1 {print $2}')
          test "$actual" = "$FINGERPRINT"
      - name: Inspect actual staging database and HTTPS configuration (read only)
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/staging_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" node < tool/staging/probe.cjs > staging-infrastructure.json
          node -e "const r=require('./staging-infrastructure.json'); console.log(JSON.stringify(r,null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: staging-infrastructure
          path: staging-infrastructure.json
          if-no-files-found: error
