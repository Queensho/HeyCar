name: heycar_app
description: Cepqar - QR tabanli anonim arac iletisim uygulamasi.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_svg: ^2.0.10+1
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  flutter_webrtc: ^1.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/Arka2.png
    - assets/Arac.png
