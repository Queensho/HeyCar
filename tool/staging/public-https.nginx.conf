# Issue #266: NEW staging-only TLS virtual host; activate only after ACME succeeds.
server {
    listen 80;
    server_name staging-api-185-165-46-213.nip.io;
    location /.well-known/acme-challenge/ {
        root /var/www/cepqontag-staging-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://staging-api-185-165-46-213.nip.io$request_uri; }
}
server {
    listen 443 ssl;
    server_name staging-api-185-165-46-213.nip.io;
    ssl_certificate /etc/letsencrypt/cepqontag-staging/live/staging-api-185-165-46-213.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/cepqontag-staging/live/staging-api-185-165-46-213.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
